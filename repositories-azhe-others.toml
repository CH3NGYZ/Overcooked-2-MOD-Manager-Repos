note_i18n.en = """
1. After exiting a custom level, automatically return to the previously selected level selection screen for convenient consecutive play. This feature can be disabled in the BepInEx Configuration Manager.
2. Display a green dot next to the most recently selected level and its containing level set. The selection is retained after restarting the game.
3. Both the level set list and the level list support search. When searching in the level set list, level sets containing matching levels are displayed. After opening a level set, matching levels are highlighted.
4. Both the level set list and the level list support sorting by name or file modification time, with options for no sorting, ascending order, and descending order.
5. Both the level set list and the level list support pinning and unpinning items. Pinned items are excluded from sorting. When using `DIYLevel Fast Load`, pinned items appear below the refresh button.
6. Display a level thumbnail when the level receives focus, and hide it when focus is lost.
- **Requires `DIYLevel` and is compatible with `DIYLevel Fast Load`.**
"""
note_i18n.ko = """
1. 사용자 지정 레벨을 종료하면 연속해서 플레이할 수 있도록 이전에 선택했던 레벨 선택 화면으로 자동으로 돌아갑니다. 이 기능은 BepInEx 구성 관리자의 설정에서 비활성화할 수 있습니다.
2. 최근에 선택한 레벨과 해당 레벨이 포함된 레벨 세트 옆에 초록색 점을 표시합니다. 게임을 다시 시작해도 선택 기록이 유지됩니다.
3. 레벨 세트 목록과 레벨 목록 모두 검색을 지원합니다. 레벨 세트 목록에서 검색하면 검색어와 일치하는 레벨이 포함된 레벨 세트가 표시되며, 레벨 세트에 들어가면 일치하는 레벨이 강조 표시됩니다.
4. 레벨 세트 목록과 레벨 목록 모두 이름 또는 파일 수정 시간을 기준으로 정렬할 수 있으며, 정렬 안 함, 오름차순, 내림차순을 지원합니다.
5. 레벨 세트 목록과 레벨 목록 모두 항목을 고정하거나 고정을 해제할 수 있습니다. 고정된 항목은 정렬 대상에서 제외됩니다. `DIYLevel 빠른 로드`를 사용하는 경우 고정된 항목은 새로고침 버튼 아래에 표시됩니다.
6. 레벨에 포커스가 있으면 해당 레벨의 미리보기 이미지가 표시되고, 포커스를 잃으면 자동으로 숨겨집니다.
- **`DIYLevel`이 필요하며 `DIYLevel 빠른 로드`와 호환됩니다.**
"""


