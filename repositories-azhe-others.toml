Fixes the issue where, after a failed room join or leaving a room, the same Steam join link keeps failing or stops responding, and the game usually has to be restarted, or an Arcade room entered and left once, before joining works again.
The mod clears stale Steam lobby membership and invite-handling state left behind by the game's join/leave flow before a link join, after a failed join, and when leaving a room. It works automatically after installation and needs no configuration.
- **Only local lobby/join state is affected; saves, levels, DIY parameters and the multiplayer protocol are not modified.**
- **Compatible with the Arcade MOD. Install it on the player who needs to rejoin; it applies to both hosts and clients.**
- **This is an untested beta build. If you encounter a bug, please report it to the author with the latest `.log` file from `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
