外掛會停止失敗的 DIYLevel 載入，關閉已失效的存檔對話框，並彈出原生 popup，顯示失敗的關卡集、關卡、載入失敗的呼叫端與範本資源，方便定位缺少的前置或損壞的地圖。
- **需安裝 DIYLevel；僅處理資源讀取失敗，不處理其它崩潰。**
- **完整相容 FastInit 1.7.0：其快速載入、按需載入、啟動 catalog 與 info bundle 最佳化全部保留，無需停用、降級或移除任何 FastInit 功能。**
- **Wloader 選用：開啟時可載入依賴 DLC 的關卡集。**
"""
note_i18n.en = """
Fixes blank save slots, unselectable entries, or unresponsive clicks in DIYLevel when a level resource fails to load (missing prerequisite, version mismatch, map conflict, and similar cases).
The mod stops the failed DIYLevel load, closes the invalidated save dialog, and shows a native popup naming the failing level set, level, caller, and template resource so the missing prerequisite or broken map can be identified.
- **Requires DIYLevel; it only handles resource-loading failures, not other crashes.**
- **Fully compatible with FastInit 1.7.0: its fast loading, on-demand loading, startup catalog and info-bundle optimizations are all kept; there is no need to disable, downgrade or remove any FastInit feature.**
- **Wloader is optional; enable it to load DLC-dependent level sets.**
"""
note_i18n.ko = """
DIYLevel에서 레벨 리소스 로드 실패(필수 요소 누락, 버전 불일치, 맵 충돌 등)로 저장 슬롯 목록이 비어 있거나 선택/클릭이 되지 않는 문제를 수정합니다.
모드는 실패한 DIYLevel 로드를 중단하고 무효화된 저장 대화상자를 닫은 뒤, 실패한 레벨 세트·레벨·호출자·템플릿 리소스를 보여주는 네이티브 popup을 표시하여 누락된 필수 요소나 손상된 맵을 찾을 수 있게 합니다.
- **DIYLevel이 필요하며 리소스 로드 실패만 처리합니다. 다른 크래시는 다루지 않습니다.**
- **FastInit 1.7.0과 완전히 호환됩니다. 빠른 로드, 온디맨드 로드, 시작 카탈로그와 info bundle 최적화가 모두 유지되며 FastInit 기능을 비활성화, 다운그레이드 또는 제거할 필요가 없습니다.**
- **Wloader는 선택 사항이며, 활성화하면 DLC가 필요한 레벨 세트를 불러올 수 있습니다.**
"""


