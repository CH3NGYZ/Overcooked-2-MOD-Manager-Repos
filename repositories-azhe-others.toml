2. Mark the last selected level and its pack with green dots, which remain after restarting the game.
3. Sort levels by name or file modification time, in ascending or descending order.
4. Pin or unpin levels and packs. Pinned entries stay at the top and are excluded from sorting; with FastInit, they appear below the refresh button.
- **Requires OC2DIYLevel and is compatible with DIYLevelFastInit.**
"""
note_i18n.ko = """
1. 사용자 지정 레벨에서 나가면 이전 레벨 선택 화면으로 자동으로 돌아가 계속 플레이할 수 있습니다.
2. 마지막으로 선택한 레벨과 해당 레벨 팩 앞에 초록색 점을 표시하며, 게임을 다시 시작해도 표시가 유지됩니다.
3. 레벨 목록을 이름 또는 파일 수정 시간에 따라 오름차순이나 내림차순으로 정렬할 수 있습니다.
4. 레벨과 레벨 팩을 상단에 고정하거나 해제할 수 있습니다. 고정된 항목은 정렬에서 제외되며, FastInit 사용 시 새로고침 버튼 아래에 표시됩니다.
- **OC2DIYLevel 설치 필요하며 DIYLevelFastInit과 호환됩니다.**
