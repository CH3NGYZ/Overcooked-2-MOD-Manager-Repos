note = """
修复安装 DIYLevel 和大量地图后，在结算界面点击“原生重开按键”可能导致主机卡死、客机掉线的问题。
通过修正游戏原生长消息分片时被正文覆盖的片数/可靠序号头字段，并按有效包长重组消息，避免触发原生可靠序号校验断连。
- **安装后自动生效，无需配置；**
- **主机和客机需安装相同版本。**
"""
note_i18n.en = """
Fixes an issue where clicking the "Native Restart" button on the results screen after installing DIYLevel and many user-created maps could cause the host to freeze and clients to disconnect. It restores the game's original long message multipart header that was overwritten by the body data and reassembles it with valid packet lengths to prevent disconnections due to stable sequence checks.
- **Automatically applied after installation, no configuration required.**
- **Hosts and clients must use the same version.**
"""
note_i18n.ko = """
DIYLevel 및 다수의 사용자 제작 맵을 설치한 후 결과 화면에서 "원본 재시작" 버튼을 클릭하면 호스트가 멈추고 클라이언트가 연결이 끊어지는 문제를 수정합니다. 본문 데이터에 의해 덮어쓰여진 게임의 원래 긴 메시지 분할 헤더를 복원하고 유효한 패킷 길이로 재조립하여 안정적인 시퀀스 검사를 통한 연결 끊김을 방지합니다.
- **설치 후 자동 적용되며, 별도의 설정이 필요하지 않습니다.**
- **호스트와 클라이언트는 동일한 버전을 사용해야 합니다.**
"""
note_i18n.zh-CN = """
修复安装 DIYLevel 和大量地图后，在结算界面点击“原生重开按键”可能导致主机卡死、客机掉线的问题。通过修正游戏原生长消息分片时被正文覆盖的片数/可靠序号头字段，并按有效包长重组消息，避免触发原生可靠序号校验断连。
- **安装后自动生效，无需配置；**
- **主机和客机需安装相同版本。**
"""
note_i18n.zh-TW = """
修復安裝 DIYLevel 和大量地圖後，在結算畫面點擊「原生重開按鍵」可能導致主機卡死、客機掉線的問題。透過修正遊戲原生長訊息分片時被正文覆蓋的片數/可靠序號頭欄位，並按有效封包長度重組訊息，避免觸發原生可靠序號校驗斷線。
- **安裝後自動生效，無需配置；**
- **主機和客機需安裝相同版本。**
"""


