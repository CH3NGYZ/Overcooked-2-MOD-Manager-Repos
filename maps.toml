# 地图源索引。
#
# 每条 [[map_sources]] 是一个「地图源」，`mode` 决定它怎么变成地图条目：
#
#   · mode = "document"（默认，可省略）
#       url 指向另一份 [[maps]] 文档。历史形态，保留兼容 —— 作者自己维护一份
#       集中式 TOML，管理器照读。
#   · mode = "repository"
#       整个仓库就是一张地图，仓库的每个 Release 是它的一个版本。条目本体写在
#       下面的 [map_sources.map] 里，不需要子源文件。
#   · mode = "release-tags"
#       一个 tag 一张地图。元数据写在各自 Release note 的
#       <!-- oc2-map ... --> 块里，管理器按 page_size 翻页读完整仓的 Release，
#       再让每张地图的条目「自动生成」出来。
#
# 第三种是给愿意自己发版的作者用的：发一个新 tag = 发布一张新地图，改 note
# = 改说明与依赖，不用再维护、同步一份集中式 TOML，也不会出现「地图发了、
# 索引忘了更新」这种半死状态。
#
# [[map_sources]] 的顺序决定源在地图页的展示顺序。
# [[map_sources]]
# # 单仓库地图：仓库里每个 Release 都是这张图的一个版本。
