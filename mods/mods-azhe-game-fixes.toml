note_i18n.zh-CN = """
修复加入房间失败或主动退出房间后，再用同一个 Steam 加入链接反复提示加入失败、点击无反应，通常必须重启游戏或先进入一次街机再退出才能恢复的问题。
插件在链接加入前、加入失败后和离房时，清理游戏原生流程残留的 Steam 大厅成员关系与邀请处理状态；安装后自动生效，无需配置。
- **仅影响本机的大厅/加入状态，不修改存档、关卡、DIY 参数或联机协议。**
- **可与街机 MOD 同时安装；需要重新加入房间的玩家安装即可，主机和客机均适用。**
- **此版本为尚未实测可用的测试版；如遇 BUG，请带上 `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/` 下最新时间的 `.log` 日志反馈给作者。**
"""
note_i18n.zh-TW = """
修復加入房間失敗或主動退出房間後，再用同一個 Steam 加入連結反覆提示加入失敗、點擊無反應，通常必須重新啟動遊戲或先進入一次街機再退出才能恢復的問題。
外掛會在連結加入前、加入失敗後和離房時，清理遊戲原生流程殘留的 Steam 大廳成員關係與邀請處理狀態；安裝後自動生效，無需設定。
- **僅影響本機的大廳/加入狀態，不修改存檔、關卡、DIY 參數或連線協定。**
- **可與街機 MOD 同時安裝；需要重新加入房間的玩家安裝即可，主機和客機均適用。**
- **此版本為尚未實測可用的測試版；如遇 BUG，請帶上 `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/` 下最新時間的 `.log` 日誌回饋給作者。**
"""
note_i18n.en = """
Fixes the issue where, after a failed room join or leaving a room, the same Steam join link keeps failing or stops responding, and the game usually has to be restarted, or an Arcade room entered and left once, before joining works again.
The mod clears stale Steam lobby membership and invite-handling state left behind by the game's join/leave flow before a link join, after a failed join, and when leaving a room. It works automatically after installation and needs no configuration.
- **Only local lobby/join state is affected; saves, levels, DIY parameters and the multiplayer protocol are not modified.**
- **Compatible with the Arcade MOD. Install it on the player who needs to rejoin; it applies to both hosts and clients.**
- **This is an untested beta build. If you encounter a bug, please report it to the author with the latest `.log` file from `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
"""
note_i18n.de = '''
Behebt das Problem, bei dem nach einem fehlgeschlagenen Raumbeitritt oder dem Verlassen eines Raumes derselbe Steam-Beitrittslink weiterhin fehlschlägt oder nicht mehr reagiert und das Spiel normalerweise neu gestartet oder ein Arcade-Raum einmal betreten und verlassen werden muss, bevor der Beitritt erneut funktioniert.
Der Mod löscht abgestandene Steam-Lobby-Mitgliedschaft und Einladungs-Handling-Zustand, der durch den Join/Leave-Fluss des Spiels vor einem Link-Join, nach einem fehlgeschlagenen Join und beim Verlassen eines Raumes zurückbleibt.
- **Nur der lokale Lobby-/Beitrittsstaat ist betroffen; Speicher, Level, DIY-Parameter und das Multiplayer-Protokoll werden nicht geändert.**
- **Kompatibel mit dem Arcade-MOD. Installieren Sie es auf dem Spieler, der wieder beitreten muss; es gilt sowohl für Hosts als auch für Clients.**
- **Wenn Sie auf einen Fehler stoßen, melden Sie ihn bitte dem Autor mit der neuesten `.log`-Datei von `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
'''
note_i18n.fr = '''
Corrige le problème où, après qu'une pièce échouée rejoint ou quitte une pièce, le même lien de jointure Steam continue d'échouer ou cesse de répondre, et le jeu doit généralement être redémarré, ou une salle d'arcade entré et laissé une fois, avant de rejoindre fonctionne à nouveau.
Le mod efface l'adhésion au lobby Steam et l'état d'invitation laissé derrière par le flux de jointure/de sortie du jeu avant la jointure d'un lien, après une jointure ratée, et lors de la sortie d'une pièce. Il fonctionne automatiquement après l'installation et ne nécessite aucune configuration.
- **Seul le lobby local/état de join est affecté; les sauvegardes, les niveaux, les paramètres de bricolage et le protocole multijoueur ne sont pas modifiés.**
- **Compatible avec le MOD Arcade. Installez-le sur le lecteur qui doit rejoindre ; il s'applique à la fois aux hôtes et aux clients.**
- **Il s'agit d'une compilation bêta non testée. Si vous rencontrez un bug, veuillez le signaler à l'auteur avec le dernier fichier `.log` de `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
'''
note_i18n.it = '''
Risolve il problema in cui, dopo che una stanza fallita si unisca o lascia una stanza, lo stesso link di Steam continua a fallire o a smettere di rispondere, e il gioco di solito deve essere riavviato, o una stanza di Arcade entrato e lasciato una volta, prima di unire i lavori di nuovo.
Il mod chiarisce l'appartenenza alla lobby di Steam e lo stato di invita-handling lasciato dietro dal flusso di entrata/uscita del gioco prima di un collegamento, dopo un'unione fallita e quando si lascia una stanza. Funziona automaticamente dopo l'installazione e non ha bisogno di configurazione.
- **Solo lo stato locale di lobby/join è interessato; salva, livelli, parametri fai-da-te e il protocollo multiplayer non sono modificati.**
- **Compatibile con il MOD Arcade. Installarlo sul giocatore che ha bisogno di ricongiungersi; si applica sia agli host che ai client.**
- **Se si incontra un bug, si prega di segnalarlo all'autore con l'ultimo file `.log` da `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
'''
note_i18n.es-ES = '''
Arregla el tema donde, después de que una habitación fallida se una o salga de una habitación, el mismo enlace de Steam sigue fallando o deja de responder, y el juego generalmente tiene que ser reiniciado, o una sala de Arcade entró y se fue una vez, antes de unirse a los trabajos de nuevo.
El mod despeja la membresía del vestíbulo de Steam y estado de invitación dejado atrás por el flujo de ensamblaje/leave del juego antes de unirse a un enlace, después de un ensamblaje fallido, y al salir de una habitación. Funciona automáticamente después de la instalación y no necesita configuración.
- **Sólo el estado local del lobby/join se ve afectado; ahorra, niveles, parámetros DIY y el protocolo multijugador no se modifican.**
- **Compatible con el Arcade MOD. Instalarlo en el jugador que necesita unirse; se aplica tanto a los anfitriones como a los clientes.**
- **Esta es una compilación de beta sin probar. Si encuentras un error, por favor reporta al autor con el último archivo `.log` de `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
'''
note_i18n.ru = '''
Исправляет проблему, когда после того, как неисправная комната присоединяется или выходит из комнаты, одна и та же ссылка присоединения Steam продолжает выходить из строя или перестает отвечать, и игра обычно должна быть перезапущена, или комната Arcade вошла и ушла один раз, прежде чем снова присоединиться к работе.
Мод очищает устаревшее членство в лобби Steam и состояние обработки приглашений, оставленное потоком присоединения / выхода игры до присоединения ссылки, после неудачного присоединения и при выходе из комнаты. Он работает автоматически после установки и не нуждается в конфигурации.
- **Пострадает только местное лобби/сообщество; сейвы, уровни, параметры DIY и многопользовательский протокол не изменяются.**
- **Совместим с Arcade MOD. Установите его на игрока, который должен присоединиться; это относится как к хостам, так и к клиентам.**
- **Если вы столкнулись с ошибкой, сообщите об этом автору с последним файлом `.log` от `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
'''
note_i18n.pl = '''
Naprawia problem, w którym po nieudanym połączeniu lub opuszczeniu pokoju, ten sam link Steam joint ciągle zawodzi lub przestaje odpowiadać, a gra zazwyczaj musi być ponownie uruchomiona, lub pokój Arcade wszedł i wyszedł raz, przed dołączeniem działa ponownie.
Mod oczyszcza nieświeże członkostwo w lobby Steam i stan obsługi invite- po lewej stronie gry, przed połączeniem z linkiem, po nieudanym połączeniu i po opuszczeniu pokoju. Działa automatycznie po instalacji i nie wymaga konfiguracji.
- **Tylko lokalne lobby / dołącz stan jest naruszony; oszczędności, poziomy, parametry DIY i protokół multiplayer nie są modyfikowane.**
- **Kompatybilny z MOD Arcade. Zainstaluj go na odtwarzaczu, który musi ponownie dołączyć; dotyczy to zarówno gospodarzy, jak i klientów.**
- **Jest to nietestowana budowa beta. Jeśli napotkasz błąd, zgłoś go do autora z najnowszym plikiem `.log` z `BepInEx/logs/com.ch3ngyz.plugin.oc2joinrecovery/`.**
'''
note_i18n.pt-BR = '''
Corrige o problema em que, depois de uma sala falhada entrar ou sair de uma sala, o mesmo link de junção Steam continua falhando ou pára de responder, e o jogo geralmente tem de ser reiniciado, ou uma sala Arcade entrou e saiu uma vez, antes de se juntar funciona novamente.
O mod elimina a adesão ao lobby do Steam e o estado de resposta a convites deixados para trás pelo fluxo de entrada/saída do jogo antes de uma ligação, após uma adesão falhada e ao sair de uma sala. Funciona automaticamente após a instalação e não necessita de configuração.
- **Apenas o estado local de lobby/join é afetado; salva, níveis, parâmetros DIY e o protocolo multiplayer não são modificados.**
- **Compatível com o Arcade MOD. Instale-o no jogador que precisa voltar; aplica-se tanto a hosts como a clientes.**
