  no MOD Manager primeiro — alguns mapas entram em conflito com os scripts em tempo de execução.
- Para uma lista de slots de nível vazia, primeiro confirme que o próprio DIYLevel funciona e os mapas
  estão na pasta certa, então remova mapas um por um para encontrar o culpado.

## Suporte

Relatar as questões no [Issues](https://github.com/guojia99/OC2DIYLevelRuntimeWLoader/issues)
com a versão do jogo, a versão em tempo de execução, o nome do mapa e as linhas relevantes de
`BepInEx/LogOutput.log`.
