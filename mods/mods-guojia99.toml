note_i18n.en = '''
# DIYLevel Web Runtime (DIYLevelRuntimeWLoader)

Custom maps exported from **Master Jiaya's WebEditor** need this runtime installed
before they can load. You do not need it for ordinary custom maps.

## When it is required

| Map source | Needs this runtime |
| --- | --- |
| Exported from WebEditor, ships a `webcustomstub_runtime` folder | **Yes** |
| Hand-made or older exports without runtime scripts | No |

If you are unsure, install it and try: a level that loads without errors needs it;
if everything works without it, leaving it disabled removes a layer of
compatibility risk.

## Dependency

- This runtime **requires** the `DIYLevel` custom-level framework. Installing it
  alone does nothing. The manager marks it as depending on DIYLevel, and the
  install flow warns when DIYLevel is missing.
- Once installed, DIYLevel calls it while loading maps.

## Installation

1. Install the **DIYLevel - Custom Levels** framework first.
2. Install this runtime.
3. Put the maps you want to play into `BepInEx/plugins/OC2DIYLevel/levels/`.

## Notes

- The archive ships `version.txt` and `log_config.txt`; use them to compare
  against the Release version when troubleshooting.
- For debugging, `debugLog.dll` and `log_config.txt` control runtime logging.
- If maps that do **not** need this runtime break after installing it, disable it
  in MOD Manager first — some maps conflict with the runtime scripts.
- For an empty level slot list, first confirm DIYLevel itself works and the maps
  are in the right folder, then remove maps one by one to find the culprit.

## Support

Report issues at [Issues](https://github.com/guojia99/OC2DIYLevelRuntimeWLoader/issues)
with the game version, runtime version, map name, and the relevant lines from
`BepInEx/LogOutput.log`.
'''
note_i18n.de = '''
# DIYLevel Web-Laufzeit (DIYLevelRuntimeWLoader)

Benutzerdefinierte Karten, die aus **Master Jiayas WebEditor** exportiert werden, benötigen diese Laufzeit.
Bevor sie laden können, brauchen Sie es nicht für gewöhnliche benutzerdefinierte Karten.

## Wenn es erforderlich ist

| Kartenquelle | Benötigt diese Laufzeit |
| --- | --- |
| Exportiert aus WebEditor, liefert einen `webcustomstub_runtime` Ordner | **Ja** |
| Handgemachte oder ältere Exporte ohne Runtime-Skripte | Nein |

Wenn Sie unsicher sind, installieren Sie es und versuchen Sie es: eine Ebene, die ohne Fehler geladen wird, benötigt es;
Wenn alles ohne es funktioniert, entfernt das Ausschalten eine Schicht von
Kompatibilitätsrisiko.

## Abhängigkeit

- Diese Laufzeit ** erfordert** das `DIYLevel` custom-level Framework.
  Der Manager kennzeichnet es als abhängig von DIYLevel, und die
  Flow-Warnen installieren, wenn DIYLevel fehlt.
- Einmal installiert, ruft DIYLevel es beim Laden von Karten auf.

## Installation

1. Installieren Sie zuerst das **DIYLevel - Custom Levels** Framework.
2. Installieren Sie diese Runtime.
3. Setzen Sie die Karten, die Sie spielen möchten, in `BepInEx/plugins/OC2DIYLevel/levels/` ein.

## Anmerkungen

- Die Archivschiffe `version.txt` und `log_config.txt`; verwenden Sie sie zum Vergleichen
  gegen die Release-Version beim Troubleshooting.
- Zum Debuggen steuern `debugLog.dll` und `log_config.txt` die Laufzeitprotokollierung.
- Wenn Karten, die **not** ausführen, diese Laufzeitpause nach der Installation benötigen, deaktivieren Sie sie
  in MOD Manager zuerst – einige Karten stehen in Konflikt mit den Runtime-Skripten.
- Für eine leere Level-Slot-Liste bestätigen Sie zuerst, dass DIYLevel selbst funktioniert und die Karten
  Sie befinden sich im rechten Ordner und entfernen dann die Karten nacheinander, um den Täter zu finden.

## Unterstützung

Probleme melden bei [Issues](https://github.com/guojia99/OC2DIYLevelRuntimeWLoader/issues)
mit der Spielversion, der Laufzeitversion, dem Kartennamen und den entsprechenden Zeilen von
`BepInEx/LogOutput.log`.
'''
