"""
note_i18n.en = """
1. After exiting a custom level, automatically return to the previously selected level selection screen for convenient consecutive play. This feature can be disabled in the MOD Settings.
2. Display a green dot next to the most recently selected level and its containing level set. The selection is retained after restarting the game.
3. Both the level set list and the level list support search. When searching in the level set list, level sets containing matching levels are displayed. After opening a level set, matching levels are highlighted.
4. Both the level set list and the level list support sorting by name or file modification time, with options for no sorting, ascending order, and descending order.
5. Both the level set list and the level list support pinning and unpinning items. Pinned items are excluded from sorting. When using `DIYLevel Fast Load`, pinned items appear below the refresh button.
6. Display a level thumbnail when the level receives focus, and hide it when focus is lost.
- **Requires `DIYLevel` and is compatible with `DIYLevel Fast Load`.**
"""
note_i18n.de = '''
1. Nach dem Beenden eines benutzerdefinierten Levels kehren Sie automatisch zum zuvor ausgewählten Level-Auswahlbildschirm für ein bequemes aufeinanderfolgendes Spielen zurück. MOD Settings.
2. Zeigen Sie einen grünen Punkt neben dem zuletzt ausgewählten Level und dessen enthaltenden Level an. Die Auswahl wird nach dem Neustart des Spiels beibehalten.
3. Sowohl die Level-Set-Liste als auch die Level-Liste unterstützen die Suche. Bei der Suche in der Level-Set-Liste werden Level-Sets mit übereinstimmenden Levels angezeigt. Nach dem Öffnen eines Level-Sets werden übereinstimmende Levels hervorgehoben.
4. Sowohl die Level-Set-Liste als auch die Level-Liste unterstützen die Sortierung nach Name oder Dateiänderungszeit, mit Optionen für keine Sortierung, aufsteigende Reihenfolge und absteigende Reihenfolge.
5. Sowohl die Level-Set-Liste als auch die Level-Liste unterstützen das Anheften und Entheften von Elementen. Angeheftete Elemente sind von der Sortierung ausgeschlossen. Bei Verwendung von `DIYLevel Fast Load` erscheinen angeheftete Elemente unter dem Refresh-Button.
6. Zeigen Sie ein Level-Miniaturbild an, wenn das Level den Fokus erhält, und verstecken Sie es, wenn der Fokus verloren geht.
- **Erfordert `DIYLevel` und ist kompatibel mit `DIYLevel Fast Load`.**
'''
note_i18n.fr = '''
1. Après avoir quitté un niveau personnalisé, retournez automatiquement à l'écran de sélection de niveau précédemment sélectionné pour une lecture consécutive pratique. Cette fonctionnalité peut être désactivée dans le MOD Settings.
2. Affichez un point vert à côté du niveau le plus récemment sélectionné et de son ensemble de niveaux contenant. La sélection est conservée après le redémarrage du jeu.
3. La liste des niveaux et la liste des niveaux supportent la recherche. Lors de la recherche dans la liste des niveaux, les ensembles de niveaux contenant des niveaux correspondants sont affichés. Après ouverture d'un jeu de niveaux, les niveaux correspondants sont surlignés.
4. La liste des niveaux et la liste des niveaux supportent le tri par nom ou heure de modification de fichier, avec des options pour aucun tri, ordre ascendant et ordre décroissant.
5. Tant la liste de niveaux que la liste de niveaux prennent en charge le piquage et le découplage des éléments. Les éléments épinglés sont exclus du tri. Lorsque vous utilisez `DIYLevel Fast Load`, les éléments épinglés apparaissent sous le bouton de rafraîchissement.
6. Affichez une vignette de niveau lorsque le niveau reçoit la mise au point, et masquez-la lorsque la mise au point est perdue.
