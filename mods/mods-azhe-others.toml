note_i18n.en = """
Fixes blank save slots, unselectable entries, or unresponsive clicks in DIYLevel when a level resource fails to load (missing prerequisite, version mismatch, map conflict, and similar cases).
The mod stops the failed DIYLevel load, closes the invalidated save dialog, and shows a native popup naming the failing level set, level, caller, and template resource so the missing prerequisite or broken map can be identified.
- **Requires DIYLevel; it only handles resource-loading failures, not other crashes.**
- **Fully compatible with FastInit 1.7.0 ~ 1.8.0: its fast loading, on-demand loading, startup catalog and info-bundle optimizations are all kept; there is no need to disable, downgrade or remove any FastInit feature.**
- **Not compatible with FastInit >=1.9.0: this mod is already included in FastInit v1.9.0 and above, no additional installation required.**
- **Wloader is optional; enable it to load DLC-dependent level sets.**
"""
note_i18n.de = '''
Behebt leere Speicherplätze, nicht wählbare Einträge oder nicht reagierende Klicks in DIYLevel, wenn eine Level-Ressource nicht geladen werden kann (fehlende Voraussetzung, Versionsfehlanpassung, Kartenkonflikt und ähnliche Fälle).
Der Mod stoppt die fehlgeschlagene DIYLevel-Ladung, schließt den ungültig gemachten Speicherdialog und zeigt ein natives Popup an, in dem die fehlgeschlagene Level-Set-, Level-, Caller- und Template-Ressource benannt wird, so dass die fehlende Voraussetzung oder die defekte Karte identifiziert werden kann.
- **Erfordert DIYLevel; es behandelt nur Fehler beim Laden von Ressourcen, nicht andere Abstürze.**
- **Vollkommen kompatibel mit FastInit 1.7.0 ~ 1.8.0: Das schnelle Laden, On-Demand-Laden, der Startkatalog und die Info-Bundle-Optimierungen werden alle beibehalten; Es besteht keine Notwendigkeit, die FastInit-Funktion zu deaktivieren, herunterzustufen oder zu entfernen.**
- **Nicht kompatibel mit FastInit >=1.9.0: Dieser Mod ist bereits in FastInit v1.9.0 und höher enthalten, keine zusätzliche Installation erforderlich.**
- **Wloader ist optional; Aktivieren Sie es, DLC-abhängige Pegelsätze zu laden.**
'''
note_i18n.fr = '''
Correction de slots d'enregistrement vierges, d'entrées non sélectionnables ou de clics non réactifs dans DIYLevel lorsqu'une ressource de niveau ne se charge pas (défaut de prérequis, erreur de version, conflit de carte, et cas similaires).
Le mod arrête la charge DIYLevel échouée, ferme la boîte de dialogue de sauvegarde invalidée, et affiche un popup natif nommant le niveau défaillant défini, le niveau, l'appelant et la ressource de modèle afin que la prérequise manquante ou la carte cassée puisse être identifiée.
