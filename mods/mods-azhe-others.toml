note_i18n.zh-CN = """
### 功能
镜头优先跟随本机当前操控的厨师，适用于原版和自制关卡。支持调整取景范围、镜头响应、边缘防拉伸及传送门平移曲线。本机两人或以上时使用原版镜头。

### 使用
默认关闭。在 [MOD 设置](https://github.com/CH3NGYZ/Overcooked-2-ModSettings/releases) 开启「启用视角自定义」，本机单人进入关卡后选择「进入视角编辑模式」。编辑时可继续操作厨师并实时预览。

### 保存
可保存到本关或存为通用设置。已有单关设置优先，保存通用设置不会覆盖它。
"""
note_i18n.zh-TW = """
### 功能
鏡頭優先跟隨本機目前操控的廚師，適用於原版和自製關卡。可調整取景範圍、鏡頭反應、邊緣防拉伸及傳送門平移曲線。本機有兩位或更多玩家時使用原版鏡頭。

### 使用
預設關閉。先在 [MOD 設定](https://github.com/CH3NGYZ/Overcooked-2-ModSettings/releases) 開啟「啟用視角自訂」，本機單人進入關卡後選擇「進入視角編輯模式」。編輯時仍可操控廚師並即時預覽。

### 儲存
可儲存至本關或存為通用設定。已有單關設定優先，儲存通用設定不會覆蓋它。
"""
note_i18n.en = """
### Features
Follow the chef you control in official and custom kitchens. Adjust framing, camera response, edge stretch reduction, and portal motion. Two or more local players keep the original camera.

### Getting started
Off by default. Enable camera customization in [MOD Settings](https://github.com/CH3NGYZ/Overcooked-2-ModSettings/releases), then open the camera editor inside a level with one local player. Keep playing while previewing changes.

### Saving
Save to the current level or set a shared default. Level-specific settings take precedence and are not overwritten by changes to the default.
"""
note_i18n.de = '''
### Merkmale
Folgen Sie dem Koch, den Sie in offiziellen und kundenspezifischen Küchen steuern. Passen Sie das Framing, die Kamerareaktion, die Kantendehnungsreduzierung und die Portalbewegung an. Zwei oder mehr lokale Spieler behalten die Originalkamera.

### Beginnen Sie
Standardmäßig ausgeschaltet. Kameraanpassung in [MOD Settings](https://github.com/CH3NGYZ/Overcooked-2-ModSettings/releases) aktivieren, dann den Kameraeditor in einem Level mit einem lokalen Player öffnen. Spielen Sie weiter, während Sie Änderungen in der Vorschau anzeigen.

### Sparen
Speichern Sie auf dem aktuellen Level oder legen Sie einen gemeinsamen Standard fest. Levelspezifische Einstellungen haben Vorrang und werden nicht durch Änderungen am Standard überschrieben.
'''
note_i18n.fr = '''
### Caractéristiques
Suivez le chef que vous contrôlez dans les cuisines officielles et personnalisées. Ajustez le cadre, la réponse de la caméra, la réduction de l'étirement des bords et le mouvement du portail.

### Commencer
