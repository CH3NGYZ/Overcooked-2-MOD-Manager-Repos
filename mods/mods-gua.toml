| Komponente | Erforderlich? | Beschreibung |
|---|---|---|
| `OC2DIYLevel` | **Erforderlich** | Das zentrale Framework für benutzerdefinierte Karten. Benutzerdefinierte Karten können nicht ohne sie abgespielt werden. |
| `OC2DIYLevel/levels` | **Erforderlich** | Alle benutzerdefinierten Karten, die Sie abspielen möchten, müssen in diesem Verzeichnis abgelegt werden. |
| `DIYLevelRuntimeWLoader` | **Erforderlich von einigen maps** | Eine gemeinsam genutzte webbasierte Voraussetzung, die von 嘉吖 erstellt wurde und Ladeunterstützung für benutzerdefinierte Karten bietet, die davon abhängen. |

## 3. Installations- und Nutzungsempfehlungen

1. **Installieren Sie das Hauptframework:** Installieren Sie das `OC2DIYLevel` benutzerdefinierte Karten-Framework.
2. **Plazieren Sie die Karten:** Legen Sie alle benutzerdefinierten Karten, die Sie abspielen möchten, in das `OC2DIYLevel/levels`-Verzeichnis.
3. **Check Kartenabhängigkeiten:** Überprüfen Sie, ob jede Karte `DIYLevelRuntimeWLoader` benötigt. Für Karten, die dies erfordern, laden Sie auch die `DIYLevelRuntimeWLoader`-Voraussetzung herunter, die von 嘉吖 erstellt wurde.

> **⚠️ Kompatibilitätsempfehlung**
> Wenn für die Karte, die Sie spielen, kein `DIYLevelRuntimeWLoader` erforderlich ist, wird empfohlen, diese Voraussetzung im MOD-Manager zu deaktivieren, um Kompatibilitätskonflikte zu reduzieren.
> Wenn eine Karte dies erfordert, aktivieren Sie sie erneut; andernfalls kann es vorkommen, dass die Karte nicht korrekt geladen wird.

## 4. Gemeinsame Fragen und Fehlerbehebung

Wenn eines der folgenden Probleme auftritt, überprüfen Sie zuerst die Kompatibilität zwischen `OC2DIYLevel`, `DIYLevelRuntimeWLoader` und den Karten in `OC2DIYLevel/levels`:

- Die Save-Slot-Liste ist nach dem Betreten des Spiels leer.

### Empfohlener Fehlerbehebungsauftrag

1. Bestätigen Sie, dass `OC2DIYLevel` korrekt installiert ist.
2. Bestätigen Sie, dass alle benutzerdefinierten Karten im `OC2DIYLevel/levels`-Verzeichnis abgelegt sind.
3. Prüfen Sie, ob die Karte von `DIYLevelRuntimeWLoader` abhängt.
4. Wenn die Karte diese Voraussetzung nicht erfordert, versuchen Sie, sie zu deaktivieren und erneut zu testen.
5. Wenn das Problem weiterhin besteht, entfernen Sie Karten einzeln, um Kompatibilitätsprobleme zwischen einer Karte und dem Framework zu identifizieren.

