note_i18n.zh-CN = """
可以通过指定按键起飞。使用前先在按键设置中设置起飞键，选项名为 Jet。
- 键盘和分体键盘玩家可直接设置 Jet 键；手柄玩家需要在这里设置一个键，再到“Steam - 库 - Overcooked! 2 - 控制器布局”将手柄按键映射到该键。
- 长按 Jet 键起飞，短按 Jet 键固定高度巡航。
- 客机只有在主机也安装此 MOD 时才能生效。
- 游戏启动时默认禁用，也可以在按键设置时按 Esc 禁用；禁用时不会改变原版游戏逻辑。
- 在“街机公开”中无效。
- 启用后重力会变为原来的五分之一，所有天花板会被移除，因此有许多不按 Jet 键也能升空的方法。"""
note_i18n.zh-TW = """
可以透過指定按鍵起飛。使用前先在按鍵設定中設定起飛鍵，選項名稱為 Jet。
- 鍵盤和分離式鍵盤玩家可直接設定 Jet 鍵；手把玩家需要在這裡設定一個按鍵，再到「Steam - 收藏庫 - Overcooked! 2 - 控制器配置」將手把按鍵對應到該鍵。
- 長按 Jet 鍵起飛，短按 Jet 鍵固定高度巡航。
- 客機只有在主機也安裝此 MOD 時才能生效。
- 遊戲啟動時預設停用，也可以在按鍵設定時按 Esc 停用；停用時不會改變原版遊戲邏輯。
- 在「街機公開」中無效。
- 啟用後重力會變為原本的五分之一，所有天花板都會移除，因此有許多不按 Jet 鍵也能升空的方法。"""
note_i18n.en = """
Fly using a configurable key. Set the takeoff key named Jet in the game key setup first.
- Keyboard and split-keyboard players can set Jet directly. Gamepad players must set a keyboard key here, then map the gamepad button to it in Steam - Library - Overcooked! 2 - Controller Layout.
- Hold Jet to take off; tap Jet to fixed height cruise.
- Clients only work when the host also has this MOD installed.
- Jet is disabled by default when the game starts. You can also press Esc during key setup to disable it; disabled mode does not change the original game logic.
- Not valid in Arcade Public.
- When enabled, gravity becomes one fifth of its original value and all ceilings are removed, so there are many ways to get airborne without pressing Jet."""
note_i18n.de = '''
Fliegen Sie mit einem konfigurierbaren Schlüssel. Setzen Sie zuerst die Starttaste namens Jet im Spielschlüssel-Setup.
- Keyboard- und Split-Tastatur-Spieler können Jet direkt einstellen. Gamepad-Spieler müssen hier eine Tastaturtaste einstellen und dann die Gamepad-Taste in Steam - Library - Overcooked! 2 - Controller Layout abbilden.
- Halten Sie Jet zum Starten; Tippen Sie auf Jet zur Kreuzfahrt in fester Höhe.
- Clients funktionieren nur, wenn der Host auch dieses MOD installiert hat.
- Jet ist standardmäßig deaktiviert, wenn das Spiel startet.Sie können auch Esc während der Tasteneinstellung drücken, um es zu deaktivieren; der deaktivierte Modus ändert die ursprüngliche Spiellogik nicht.
- Nicht gültig in Arcade Public.
- Wenn es aktiviert ist, wird die Schwerkraft ein Fünftel ihres ursprünglichen Wertes und alle Decken werden entfernt, so dass es viele Möglichkeiten gibt, in die Luft zu gelangen, ohne den Jet zu drücken.
'''
note_i18n.fr = '''
Volez à l'aide d'une clé configurable. Définissez d'abord la clé de décollage nommée Jet dans la configuration de la clé de jeu.
- Les joueurs de clavier et de clavier partagé peuvent définir directement Jet. Les joueurs de jeu doivent définir une clé de clavier ici, puis mapper le bouton de gamepad à lui dans Steam - Library - Overcooked! 2 - Controller Layout.
- Maintenez Jet pour décoller; appuyez sur Jet à croisière en hauteur fixe.
- Les clients ne fonctionnent que lorsque l'hôte a également installé ce MOD.
- Jet est désactivé par défaut lorsque le jeu démarre. Vous pouvez également appuyer sur Esc pendant la configuration de la clé pour le désactiver ; le mode désactivé ne modifie pas la logique du jeu original.
- Non valide dans Arcade Public.
- Lorsque activé, la gravité devient un cinquième de sa valeur initiale et tous les plafonds sont enlevés, il y a donc de nombreuses façons d'obtenir l'air sans presser Jet.
'''
note_i18n.it = '''
Volare utilizzando una chiave configurabile. Impostare il tasto di decollo chiamato Jet nella configurazione chiave di gioco prima.
- I giocatori della tastiera e dello split-keyboard possono impostare direttamente Jet. I giocatori del gamepad devono impostare una chiave della tastiera qui, quindi mappare il pulsante del gamepad su di esso in Steam - Library - Overcooked! 2 - Controller Layout.
- Tenere Jet per decollare; toccare Jet a crociera di altezza fissa.
- I clienti funzionano solo quando l'host ha installato anche questo MOD.
- Jet è disabilitato di default quando il gioco inizia. È anche possibile premere Esc durante la configurazione chiave per disattivarlo; la modalità disabilitata non cambia la logica di gioco originale.
- Non valido in Arcade Public.
- Quando è abilitata, la gravità diventa un quinto del suo valore originale e tutti i soffitti vengono rimossi, quindi ci sono molti modi per ottenere in volo senza premere Jet.
'''
note_i18n.es-ES = '''
Volar usando una tecla configurable. Establecer la clave de despegue llamada Jet en la configuración de clave del juego primero.
- Los jugadores de teclado y split-keyboard pueden configurar Jet directamente. Los jugadores de Gamepad deben configurar una tecla de teclado aquí, a continuación, mapear el botón de gamepad en Steam - Biblioteca - Overcooked! 2 - Controller Layout.
- Sostenga a Jet para despegar; grifo Jet a crucero de altura fijo.
- Los clientes sólo funcionan cuando el host también tiene este MOD instalado.
- Jet está deshabilitado por defecto cuando el juego comienza. También puede pulsar Esc durante la configuración clave para deshabilitarlo; el modo deshabilitado no cambia la lógica del juego original.
- No es válido en Arcade Public.
- Cuando está habilitada, la gravedad se convierte en una quinta parte de su valor original y se eliminan todos los techos, por lo que hay muchas maneras de obtener el aire sin presionar Jet.
'''
note_i18n.ru = '''
Полетайте с помощью настраиваемого ключа. Сначала установите стартовый ключ Jet в настройках ключа игры.
- Игроки на клавиатуре и сплит-клавиатуре могут установить Jet напрямую. Игроки на геймпаде должны установить клавишу клавиатуры здесь, затем нанести на нее кнопку геймпада в Steam - Library - Overcooked! 2 - Controller Layout.
- Держите Jet, чтобы взлететь; нажмите Jet, чтобы совершить круиз по фиксированной высоте.
- Клиенты работают только тогда, когда у хоста также установлен этот MOD.
- Jet отключен по умолчанию при запуске игры. Также можно нажать Esc во время настройки ключа, чтобы отключить его; отключенный режим не меняет исходную логику игры.
- Не действует в Arcade Public.
- При включении гравитация становится одной пятой от ее первоначального значения, и все потолки снимаются, поэтому есть много способов подняться в воздух без нажатия Jet.
'''
note_i18n.pl = '''
Leć za pomocą klawisza konfigurowalnego. Ustaw najpierw klawisz startu o nazwie Jet w konfiguracji klucza gry.
- Gracze na klawiaturze i klawiaturze mogą ustawić Jet bezpośrednio. Gracze Gamepad muszą ustawić tutaj klawisz klawiatury, a następnie mapować przycisk gamepad do niego w Steam - Library - Overcooked! 2 - Controller Layout.
