note_i18n.zh-CN = """
随机食材 MOD。
- 在游戏主菜单“设置 - MOD”中启用，默认不启用。
- 只需主机启用即可生效；如果客机没有安装此 MOD，分数更新可能会有延迟。
- 食材箱中的内容会不时随机变化，食材和厨具会变得昂贵，厨房还会在每次上菜后随机起火。
- 在“街机公开”中无效。"""
note_i18n.zh-TW = """
隨機食材 MOD。
- 在遊戲主選單「設定 - MOD」中啟用，預設為關閉。
- 只需主機啟用即可生效；如果客機沒有安裝此 MOD，分數更新可能會延遲。
- 食材箱中的內容會不時隨機變化，食材和廚具會變得昂貴，廚房還會在每次上菜後隨機起火。
- 在「街機公開」中無效。"""
note_i18n.en = """
Ingredient randomizer MOD.
- Enable in the game main menu under Settings - MOD (disabled by default).
- Only the host needs to enable it. Scores may update with a delay if guests do not have this MOD installed.
- Ingredient box contents shuffle periodically, ingredients and cookware become costly, and the kitchen randomly catches fire after each serving.
- Not valid in Arcade Public."""
note_i18n.de = '''
Inhaltsstoff Randomizer MOD.
