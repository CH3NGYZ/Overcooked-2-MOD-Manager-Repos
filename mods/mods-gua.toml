- Inhaltsstoff-Box-Inhalte mischen regelmäßig, Zutaten und Kochgeschirr werden teuer, und die Küche fängt nach dem Zufallsprinzip Feuer nach jeder Portion.
- Nicht gültig in Arcade Public.
