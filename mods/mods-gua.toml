note_i18n.ru = '''
Жесткая Орда увеличивает сложность уровней орды.
- Включено в главном меню игры в разделе Настройки - MOD (отключено по умолчанию).
- Включать его должен только хозяин, в том числе и в аркадном режиме.
- Всем врагам требуется один дополнительный заказ (два на зомби-хлеб и чили, три на яблоки).
- В конце каждой волны начинается следующая волна, не дожидаясь, пока все враги будут побеждены.
