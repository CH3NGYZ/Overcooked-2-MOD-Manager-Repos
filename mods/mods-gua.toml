note_i18n.zh-CN = """
困难敌群 MOD，可以提高敌群难度。
- 在游戏主菜单“设置 - MOD”中启用，默认不启用。
- 只需主机启用即可生效，包括街机模式。
- 所有敌人都需要多吃一份订单（僵尸面包和辣椒需要两份，苹果需要三份）。
- 每波结束后，不再等待所有敌人被击败就会开始下一波。
- 菜单生成规则会从独立随机改为普通关卡的生成规则。"""
note_i18n.zh-TW = """
困難敵群 MOD，可以提高敵群難度。
- 在遊戲主選單「設定 - MOD」中啟用，預設為關閉。
- 只需主機啟用即可生效，包括街機模式。
- 所有敵人都需要多吃一份訂單（殭屍麵包和辣椒需要兩份，蘋果需要三份）。
- 每波結束後，不再等待所有敵人被擊敗就會開始下一波。
- 選單生成規則會從獨立隨機改為一般關卡的生成規則。"""
note_i18n.en = """
Hard Horde increases the difficulty of horde levels.
- Enable in the game main menu under Settings - MOD (disabled by default).
- Only the host needs to enable it, including in arcade mode.
- All enemies require one extra order (two for zombie breads and chilies, three for apples).
- At the end of each wave, the next wave starts without waiting for all enemies to be defeated.
- Menu generation changes from independent random generation to the normal level generation rules."""
note_i18n.de = '''
Hard Horde erhöht die Schwierigkeit von Horden-Levels.
- Aktivieren Sie im Hauptmenü des Spiels unter Einstellungen - MOD (standardmäßig deaktiviert).
- Nur der Host muss es aktivieren, auch im Arcade-Modus.
- Alle Gegner benötigen eine zusätzliche Bestellung (zwei für Zombie-Brot und Chilis, drei für Äpfel).
- Am Ende jeder Welle beginnt die nächste Welle, ohne darauf zu warten, dass alle Feinde besiegt werden.
- Die Menu-Generierung wechselt von der unabhängigen Zufallsgenerierung zu den normalen Level-Generierungsregeln.
'''
note_i18n.fr = '''
La horde dure augmente la difficulté des niveaux de horde.
- Activer dans le menu principal du jeu sous Paramètres - MOD (désactivé par défaut).
- Seul l'hôte doit l'activer, y compris en mode arcade.
- Tous les ennemis ont besoin d'un ordre supplémentaire (deux pour les pains et chilis zombies, trois pour les pommes).
- À la fin de chaque vague, la prochaine vague commence sans attendre que tous les ennemis soient vaincus.
- La génération de menus passe de la génération aléatoire indépendante aux règles de génération de niveau normal.
'''
note_i18n.it = '''
Orda dura aumenta la difficoltà di livelli di orda.
- Attivare nel menu principale del gioco sotto Impostazioni - MOD (disabilitato per impostazione predefinita).
- Solo l'host deve abilitarlo, anche in modalità arcade.
- Tutti i nemici richiedono un ordine extra (due per pani zombie e peperoncino, tre per mele).
- Alla fine di ogni onda, l'onda successiva inizia senza aspettare che tutti i nemici vengano sconfitti.
- La generazione del menu cambia da generazione casuale indipendente alle normali regole di generazione del livello.
'''
note_i18n.es-ES = '''
La horda dura aumenta la dificultad de los niveles de horda.
- Activar en el menú principal del juego bajo Ajustes - MOD (desactivado por defecto).
- Sólo el anfitrión necesita habilitarlo, incluso en modo arcade.
