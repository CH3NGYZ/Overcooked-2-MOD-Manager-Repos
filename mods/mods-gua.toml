note_i18n.zh-CN = """
可以投掷盘子等游戏原本不能投掷的物品，也可以抬起并投掷其他厨师。
- 投掷达人：可以投掷除灭火器、水枪、奶油、呼呼外的任何物品。
- 投掷人：可以抬起和投掷其他厨师，客机效果受延迟影响较大。
- 在游戏主菜单“设置 - MOD”中启用，默认不启用。
- 主机安装后可自行生效；联机时主机需要安装并启用，主客机都启用后客机才能投掷。
- 进入“街机公开”时功能会自动关闭，以免影响其他玩家。"""
note_i18n.zh-TW = """
可以投擲盤子等遊戲原本不能投擲的物品，也可以抬起並投擲其他廚師。
- 投擲達人：可以投擲除滅火器、水槍、奶油、呼呼以外的任何物品。
- 投擲人：可以抬起並投擲其他廚師，客機效果較容易受到延遲影響。
- 在遊戲主選單「設定 - MOD」中啟用，預設為關閉。
- 主機安裝後可自行生效；連線遊玩時主機需要安裝並啟用，主客機都啟用後客機才能投擲。
- 進入「街機公開」時功能會自動關閉，以免影響其他玩家。"""
note_i18n.en = """
Throw normally unthrowable items such as plates, and pick up and throw other chefs.
- Throw Master: throw any item except fire extinguishers, water guns, cream, and whoopee cushions.
- Throw Person: pick up and throw other chefs; client behavior can be affected by latency.
- Enable it in the game main menu under Settings - MOD. It is disabled by default.
- The host can use it after installing it. In multiplayer, the host must install and enable it; both host and client must enable it for clients to throw.
- The feature is automatically disabled in Arcade Public to avoid affecting other players."""
note_i18n.de = '''
Werfen Sie normalerweise unwerfbare Gegenstände wie Teller und nehmen Sie andere Köche auf und werfen Sie sie.
- Throw Master: Werfen Sie jeden Gegenstand außer Feuerlöscher, Wasserpistolen, Creme und Whoopee-Kissen.
- Werfen Sie Person: Nehmen Sie andere Köche auf und werfen Sie sie; Das Kundenverhalten kann durch Latenz beeinflusst werden.
- Aktivieren Sie es im Spiel-Hauptmenü unter Einstellungen - MOD. Es ist standardmäßig deaktiviert.
- Der Host kann es nach der Installation verwenden. Im Multiplayer muss der Host es installieren und aktivieren; sowohl Host als auch Client müssen es für Clients aktivieren.
- Die Funktion wird in Arcade Public automatisch deaktiviert, um andere Spieler nicht zu beeinträchtigen.
'''
note_i18n.fr = '''
Jetez normalement des objets incandescentes comme des assiettes, et ramassez et jetez d'autres chefs.
- Lancez Maître : jetez n'importe quel objet sauf des extincteurs, des pistolets à eau, de la crème et des coussins de whopee.
- Personne à lancer : prendre et jeter d'autres chefs; le comportement du client peut être affecté par la latence.
- Activez-le dans le menu principal du jeu sous Paramètres - MOD. Il est désactivé par défaut.
- L'hôte peut l'utiliser après l'avoir installé. Dans le multijoueur, l'hôte doit l'installer et l'activer ; à la fois l'hôte et le client doivent permettre aux clients de lancer.
- La fonctionnalité est automatiquement désactivée dans Arcade Public pour éviter d'affecter d'autres joueurs.
'''
note_i18n.it = '''
Gettare oggetti normalmente non affollati come piatti, e raccogliere e lanciare altri chef.
- Throw Master: gettare qualsiasi elemento tranne estintori di fuoco, pistole ad acqua, crema e cuscini whoopee.
- Throw Person: raccogliere e lanciare altri chef; il comportamento del cliente può essere influenzato dalla latenza.
