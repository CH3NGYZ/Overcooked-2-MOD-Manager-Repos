note_i18n.zh-CN = "此模组用于管理《主机实用MOD》等MOD创建的配置，其默认打开的快捷键是 F1，但可能经由《主机实用MOD》自动修改为 P。"
note_i18n.zh-TW = "此模組用於管理《主機實用MOD》等MOD建立的設定，預設開啟快捷鍵為 F1，但可能會由《主機實用MOD》自動修改為 P。"
note_i18n.en = "This mod is used to manage configurations created by mods such as HostUtilities. Its default hotkey is F1, but HostUtilities may automatically change it to P."
note_i18n.de = "Dieser Mod wird verwendet, um Konfigurationen zu verwalten, die von Mods wie HostUtilities erstellt wurden. Sein Standard-Hotkey ist F1, aber HostUtilities kann ihn automatisch in P ändern."
note_i18n.fr = "Ce mod est utilisé pour gérer les configurations créées par des mods tels que HostUtilities. Son hotkey par défaut est F1, mais HostUtilities peut automatiquement le changer en P."
note_i18n.it = "Questa modifica viene utilizzata per gestire le configurazioni create da mod come HostUtilities. La sua hotkey predefinita è F1, ma HostUtilities può cambiarla automaticamente in P."
note_i18n.es-ES = "Este mod se utiliza para gestionar las configuraciones creadas por mods como HostUtilities. Su llave caliente predeterminada es F1, pero HostUtilities puede cambiarla automáticamente a P."
note_i18n.ru = "Этот мод используется для управления конфигурациями, созданными модами, такими как HostUtilities. Его горячим ключом по умолчанию является F1, но HostUtilities может автоматически изменить его на P."
note_i18n.pl = "Ten mod jest używany do zarządzania konfiguracją stworzoną przez mody takie jak HostUtilities. Domyślny hotkey to F1, ale HostUtilities może automatycznie zmienić go na P."
note_i18n.pt-BR = "Este mod é usado para gerenciar configurações criadas por mods como HostUtilities. Sua tecla de atalho padrão é F1, mas HostUtilities pode alterá-la automaticamente para P."
note_i18n.ko = "이 모드는 《HostUtilities》와 같은 MOD에서 생성한 설정을 관리하는 데 사용됩니다. 기본 단축키는 F1이지만, 《HostUtilities》에 의해 자동으로 P로 변경될 수 있습니다."
note_i18n.ja = """この MOD は、《HostUtilities》などの MOD が作成した設定を管理するためのものです。既定の起動キーは F1 ですが、《HostUtilities》によって自動的に P に変更される場合があります。"""


