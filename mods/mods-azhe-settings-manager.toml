note_i18n.zh-CN = "为 Unity IMGUI 界面提供高分屏缩放，解决 BepInEx 配置管理器在高分屏上显示太小的问题。会安装在 BepInEx/patchers 里，因此不会在 MOD 管理里出现。"
note_i18n.zh-TW = "為 Unity IMGUI 介面提供高分螢幕縮放，解決 BepInEx 設定管理器在高分螢幕上顯示過小的問題。會安裝在 BepInEx/patchers 裡，因此不會在 MOD 管理裡出現。"
note_i18n.en = "Provides HiDPI scaling for Unity IMGUI interfaces, fixing the issue of BepInEx Configuration Manager appearing too small on high-resolution screens. It will be installed in BepInEx/patchers, so it won't appear in the mod management."
note_i18n.ko = "Unity IMGUI 인터페이스에 HiDPI 스케일링을 제공하여 고해상도 화면에서 BepInEx 구성 관리자가 너무 작게 표시되는 문제를 해결합니다. BepInEx/patchers에 설치되므로 모드 관리에 나타나지 않습니다."
note_i18n.ja = """Unity IMGUI インターフェースに高解像度ディスプレイ向けのスケーリングを提供し、BepInEx コンフィグマネージャーが高解像度画面で小さく表示される問題を解決します。BepInEx/patchers にインストールされるため、MOD 管理には表示されません。"""
