note_i18n.zh-CN = "为 Unity IMGUI 界面提供高分屏缩放，解决 BepInEx 配置管理器在高分屏上显示太小的问题。会安装在 BepInEx/patchers 里，因此不会在 MOD 管理里出现。"
note_i18n.zh-TW = "為 Unity IMGUI 介面提供高分螢幕縮放，解決 BepInEx 設定管理器在高分螢幕上顯示過小的問題。會安裝在 BepInEx/patchers 裡，因此不會在 MOD 管理裡出現。"
note_i18n.en = "Provides HiDPI scaling for Unity IMGUI interfaces, fixing the issue of BepInEx Configuration Manager appearing too small on high-resolution screens. It will be installed in BepInEx/patchers, so it won't appear in the mod management."
note_i18n.de = "Bietet HiDPI-Skalierung für Unity IMGUI-Schnittstellen und behebt das Problem, dass BepInEx Configuration Manager auf hochauflösenden Bildschirmen zu klein erscheint. Es wird in BepInEx/patchers installiert, so dass es nicht in der Mod-Verwaltung erscheint."
note_i18n.fr = "Fournit l'échelle HiDPI pour les interfaces Unity IMGUI, en corrigeant le problème de BepInEx Configuration Manager apparaissant trop petit sur les écrans haute résolution. Il sera installé dans BepInEx/patchers, de sorte qu'il n'apparaîtra pas dans la gestion mod."
note_i18n.it = "Fornisce lo scaling HiDPI per le interfacce Unity IMGUI, fissando il problema di BepInEx Configuration Manager che appare troppo piccolo su schermi ad alta risoluzione. Sarà installato in BepInEx/patchers, quindi non apparirà nella gestione mod."
note_i18n.es-ES = "Proporciona escalado HiDPI para interfaces Unity IMGUI, fijando el problema de BepInEx Configuration Manager que aparece demasiado pequeño en pantallas de alta resolución. Se instalará en BepInEx/patchers, por lo que no aparecerá en la administración mod."
note_i18n.ru = "Обеспечивает масштабирование HiDPI для интерфейсов Unity IMGUI, фиксируя проблему появления BepInEx Configuration Manager слишком маленьким на экранах с высоким разрешением. Он будет установлен в BepInEx/patchers, поэтому в управлении модом он не появится."
note_i18n.pl = "Zapewnia skalowanie HiDPI dla interfejsów Unity IMGUI, naprawiając problem BepInEx Configuration Manager pojawiające się zbyt małe na ekranach wysokiej rozdzielczości. Zostanie zainstalowany w BepInEx/patchers, więc nie pojawi się w zarządzaniu modem."
note_i18n.pt-BR = "Fornece escala HiDPI para interfaces Unity IMGUI, fixando o problema de BepInEx Configuration Manager aparecendo muito pequeno em telas de alta resolução. Ele será instalado em BepInEx/patchers, então ele não aparecerá no gerenciamento de mod."
note_i18n.ko = "Unity IMGUI 인터페이스에 HiDPI 스케일링을 제공하여 고해상도 화면에서 BepInEx 구성 관리자가 너무 작게 표시되는 문제를 해결합니다. BepInEx/patchers에 설치되므로 모드 관리에 나타나지 않습니다."
note_i18n.ja = """Unity IMGUI インターフェースに高解像度ディスプレイ向けのスケーリングを提供し、BepInEx コンフィグマネージャーが高解像度画面で小さく表示される問題を解決します。BepInEx/patchers にインストールされるため、MOD 管理には表示されません。"""
