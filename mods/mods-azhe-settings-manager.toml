note_i18n.zh-CN = "原生风格的公共 MOD 设置页，支持即时搜索、改键和颜色选择。首次进入主菜单后，按反引号／波浪号键开关。"
note_i18n.zh-TW = "原生風格的共用 MOD 設定頁，支援即時搜尋、改鍵與顏色選擇。首次進入主選單後，按反引號／波浪號鍵開關。"
note_i18n.en = "A native-style shared MOD settings page with live search, key rebinding, and a color picker. After first reaching the main menu, toggle it with the backquote/tilde key."
note_i18n.de = "Eine native gemeinsame MOD-Einstellungsseite mit Live-Suche, Key Rebinding und einer Farbauswahl. Nachdem Sie das Hauptmenü zuerst erreicht haben, schalten Sie es mit der Backquote / Tilde-Taste um."
note_i18n.fr = "Une page de paramètres MOD partagée de style natif avec recherche en direct, reliure des clés et sélection de couleurs. Après avoir atteint le menu principal, basculez-la avec la touche backquote/tilde."
note_i18n.it = "Una pagina di impostazioni MOD condivise in stile nativo con ricerca dal vivo, rilegatura delle chiavi e un raccoglitore di colori. Dopo aver raggiunto il menu principale, applicarlo con la chiave backquote/tilde."
note_i18n.es-ES = "Una página de configuración compartida de estilo nativo con búsqueda en vivo, rebinación de teclas y un selector de color. Después de llegar al menú principal, cambiarlo con la tecla backquote/tilde."
note_i18n.ru = "Нативный стиль разделил страницу настроек MOD с живым поиском, перебиндингом ключей и выбором цвета.После первого достижения главного меню переключите его с помощью клавиши backquote/tilde."
note_i18n.pl = "Natively-style wspólne ustawienia MOD strona z wyszukiwaniem na żywo, ponowne powiązanie klawiszy i picker kolorów. Po pierwszym dotarciu do głównego menu, przełącz go z klawisz backquote / tilde."
note_i18n.pt-BR = "Uma página de configurações de MOD compartilhadas de estilo nativo com busca ao vivo, rebinagem de teclas e um seletor de cores. Depois de atingir o menu principal, ative- o com a tecla backquote/tilde."
note_i18n.ko = "실시간 검색, 키 변경, 색상 선택기를 갖춘 네이티브 스타일의 공용 MOD 설정 페이지입니다. 최초 메인 메뉴 진입 후 백쿼트/물결표 키로 열고 닫습니다."
note_i18n.ja = "即時検索、キー変更、色選択に対応したネイティブ風の共通 MOD 設定画面です。初回メインメニュー表示後、バッククォート／チルダキーで開閉できます。"


