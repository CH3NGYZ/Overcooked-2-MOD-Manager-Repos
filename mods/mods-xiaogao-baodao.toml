# 仓库备注
note_i18n.zh-CN = """
搬运桌台、砧板、洗碗池和上菜口等家具，桌上的锅、盘子等内容物随之移动；支持跨楼层、移动平台和网格吸附预览。
- **G**：拿起 / 放下桌台；面朝目标位置放置，附近无空格时继续抱着。
- **F7**：开启 / 关闭功能，关闭时自动归还正在搬运的桌台。
- 可在 `MOD设置` 修改键位等设置；联机时主机与所有客机都需要安装。
"""
note_i18n.zh-TW = """
搬運桌台、砧板、洗碗池與出餐口等家具，桌上的鍋、盤子等內容物會隨之移動；支援跨樓層、移動平台與網格吸附預覽。
- **G**：拿起 / 放下桌台；面向目標位置放置，附近沒有空格時會繼續抱著。
- **F7**：開啟 / 關閉功能，關閉時自動歸還正在搬運的桌台。
- 可在 `MOD设置` 修改按鍵等設定；連線時主機與所有客機都需要安裝。
"""
note_i18n.en = """
Move counters, chopping boards, sinks, serving stations, and their contents. Supports different floors, moving platforms, and a grid-snapped placement preview.
- **G**: pick up / put down furniture. Face the intended location; if no free space is nearby, keep carrying it.
- **F7**: enable / disable the feature. Disabling returns carried furniture to its original position.
- Change keys and settings in `MOD Settings`. The host and every client must install the mod for multiplayer.
"""
note_i18n.de = '''
Verschiebezähler, Hackbretter, Waschbecken, Servierstationen und deren Inhalt. Unterstützt verschiedene Stockwerke, bewegliche Plattformen und eine Raster-Platzierungsvorschau.
- **G**: Möbel aufnehmen / ablegen. Stellen Sie sich dem vorgesehenen Ort gegenüber; wenn kein freier Raum in der Nähe ist, tragen Sie ihn weiter.
- **F7**: Schaltet die Funktion ein oder aus. Beim Ausschalten kehren getragene Möbel an ihren ursprünglichen Platz zurück.
- Ändern Sie die Tasten und Einstellungen in `MOD Settings`. Der Host und jeder Client müssen den Mod für den Multiplayer installieren.
'''
note_i18n.fr = '''
Déplacez les compteurs, les planches à découper, les éviers, les stations de service et leur contenu.
- **G**: ramassage / pose des meubles. Face à l'emplacement prévu; si aucun espace libre n'est à proximité, continuez à le porter.
- **F7** : active ou désactive la fonction. À la désactivation, les meubles transportés retrouvent leur place d’origine.
- Changer les touches et les paramètres dans `MOD Settings`. L'hôte et chaque client doivent installer le mod pour multijoueur.
'''
note_i18n.it = '''
Sposta contatori, taglienti, lavandini, stazioni di servizio e il loro contenuto. Supporta diversi piani, piattaforme mobili e un'anteprima di posizionamento a griglia.
- **G**: raccogliere / mettere giù mobili. Affrontare la posizione prevista; se non c'è spazio libero nelle vicinanze, continuare a portarlo.
- **F7**: attiva o disattiva la funzione. Quando la disattivi, gli arredi trasportati tornano al loro posto.
- Cambia le chiavi e le impostazioni in `MOD Settings`. L'host e ogni client devono installare il mod per il multiplayer.
'''
note_i18n.es-ES = '''
Mueve contadores, tablas de cortar, fregaderos, estaciones de servicio y su contenido. Admite diferentes pisos, plataformas móviles, y una vista previa de colocación en cuadrícula.
- **G**: recoger / poner los muebles. Enfrente a la ubicación prevista; si no hay espacio libre cerca, mantenga la carga.
- **F7**: activa o desactiva la función. Al desactivarla, los muebles que lleves vuelven a su sitio.
- Cambiar las teclas y la configuración en `MOD Settings`. El host y cada cliente deben instalar el mod para multijugador.
'''
note_i18n.ru = '''
Переместите счетчики, разделочные доски, раковины, обслуживающие станции и их содержимое. Поддерживает различные этажи, движущиеся платформы и предварительный просмотр места размещения.
- **GQ**: поднимите/положите мебель лицом к предполагаемому месту; если поблизости нет свободного места, продолжайте нести ее.
- **F7**: включает и отключает функцию. При отключении переносимая мебель возвращается на исходное место.
- Измените клавиши и настройки в `MOD Settings`. Хост и каждый клиент должны установить мод для мультиплеера.
'''
note_i18n.pl = '''
Przenieś liczniki, deski tnące, umywalki, stacje serwisowe i ich zawartość. Obsługuje różne podłogi, ruchome platformy, i zacięty grid podgląd rozmieszczenia.
- **G**: podnieść / odłożyć meble. Staw czoła planowanej lokalizacji; jeśli nie ma wolnego miejsca w pobliżu, należy go nosić.
- **F7**: włącza i wyłącza funkcję. Po wyłączeniu przenoszone meble wracają na swoje miejsce.
- Zmień klucze i ustawienia w `MOD Settings`. Host i każdy klient musi zainstalować mod dla multiplayera.
'''
note_i18n.pt-BR = '''
Mover contadores, tábuas de corte, pias, estações de serviço, e seu conteúdo. Suporta pisos diferentes, plataformas móveis e uma visualização de colocação de grade-snapped.
- **G**: pick up / colocar para baixo móveis. De frente para o local pretendido; se não há espaço livre está perto, continue carregando-o.
- **F7**: ativa ou desativa o recurso. Ao desativá-lo, os móveis que estiver carregando voltam à posição original.
- Alterar chaves e configurações no `MOD Settings`. A máquina e cada cliente devem instalar o mod para multiplayer.
'''
note_i18n.ko = """
작업대, 도마, 싱크대, 서빙대와 그 위의 내용물을 함께 옮깁니다. 층간 이동, 움직이는 발판, 격자에 맞춘 배치 미리보기를 지원합니다.
- **G**: 가구 들기 / 내려놓기. 놓을 방향을 바라보세요. 근처에 빈칸이 없으면 계속 들고 있습니다.
- **F7**: 기능 켜기 / 끄기. 끄면 들고 있던 가구가 원래 위치로 돌아갑니다.
- `MOD Settings`에서 키와 설정을 변경할 수 있습니다. 멀티플레이에서는 호스트와 모든 클라이언트가 설치해야 합니다.
"""
note_i18n.ja = """
作業台、まな板、シンク、配膳口などを、鍋や皿などの中身ごと運べます。階をまたぐ移動、移動床、グリッドに吸着する配置プレビューに対応します。
- **G**：家具を持ち上げる / 置く。置きたい方向を向いて操作し、近くに空きがなければ持ち続けます。
- **F7**：機能の有効 / 無効。無効にすると運搬中の家具を元の位置に戻します。
- `MOD Settings`でキーなどを変更できます。マルチプレイではホストと全クライアントに導入が必要です。
"""

