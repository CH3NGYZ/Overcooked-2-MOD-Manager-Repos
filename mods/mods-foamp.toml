note_i18n.pt-BR = '''
Um mod BepInEx para ver receitas em Overcooked! 2. Ele usa as placas de receita originais do jogo para exibir todas as receitas disponíveis no nível atual, tornando-as mais fáceis de visualizar, organizar e compartilhar.

**Esta é uma ferramenta de visualização, organização e compartilhamento de receitas. Ela só muda a exibição e o layout do visualizador e não altera as ordens reais, a geração de pedidos, a ordem de serviço, os timers ou as pontuações.**

## Características

- Suporta níveis oficiais e mapas personalizados que fornecem dados padrão da receita do jogo.
- Veja receitas disponíveis no nível atual com várias opções de classificação, incluindo ordenação por aparelho.
- Arraste receitas para reorganizar suas posições e reordene linhas inteiras.
- Salva automaticamente layouts personalizados para cada nível, com suporte para salvar e alternar entre vários layouts.
- Suporta rolagem, zoom, exportação do layout completo da receita como PNG e cópia para a área de transferência.
- Usa automaticamente chinês ou inglês baseado na língua do jogo.

## Utilização

Digite um nível e pressione a tecla `Insert` para abrir o Visualizador de Receitas. Use a barra de ferramentas para selecionar opções de ordenação, salvar layouts e exportar imagens.
Você pode usar **MOD Settings** para configurar **Overcooked2RecipeViewer**.

## Atalhos

| Acção | Chave / Mouse |
| --- | --- |
| Mostrar / ocultar o visualizador | **Insert** (padrão, configurável) |
| Deslocamento vertical | **Roda do Mouse** / **PageUp, PageDown** |
| Deslocamento horizontal | **Shift + Roda do Rato** |
| Ampliação (50%–200%) | **Ctrl + Roda do Rato** |
| Mover a receita | Arraste uma carta de receita |
| Mover a linha inteira | Arraste o cabo do lado esquerdo de uma linha |

## Relatórios de Erros

Se você encontrar um problema, visite [Issues](https://github.com/foamp/Overcooked2RecipeViewer/issues) e inclua as versões de jogo e mod, nível e contagem de jogadores, passos de reprodução e registros relevantes do `BepInEx\LogOutput.log`. Screenshots são úteis para problemas de UI.
'''

note_i18n.ko = '''
BepInEx 기반의 《Overcooked! 2》 레시피 보기 모드입니다. 게임의 기본 레시피 카드를 사용하여 현재 스테이지에서 사용할 수 있는 모든 레시피를 표시하므로 레시피를 미리 확인하고 정리하거나 공유할 수 있습니다.

**이 모드는 레시피를 확인하고 정리하며 공유하기 위한 도구입니다. 레시피 뷰어의 표시와 레이아웃만 변경하며 실제 주문, 주문 생성 로직, 음식 제출 순서, 시간 제한 또는 점수에는 영향을 주지 않습니다.**

## 기능

- 공식 스테이지와 게임의 표준 레시피 데이터를 제공하는 커스텀 맵을 지원합니다.
- 현재 스테이지의 레시피를 확인하고 조리 기구별 정렬 등 다양한 방식으로 정렬할 수 있습니다.
- 레시피의 위치와 전체 행의 순서를 드래그하여 자유롭게 정리할 수 있습니다.
- 각 스테이지의 사용자 지정 레이아웃을 자동으로 저장하며 여러 레이아웃을 저장하고 전환할 수 있습니다.
- 스크롤, 확대/축소, 전체 레시피 이미지 PNG 내보내기 및 클립보드 복사를 지원합니다.
- 게임 언어에 따라 중국어 또는 영어 인터페이스를 자동으로 사용합니다.

## 사용 방법

스테이지에 들어간 후 `Insert` 키를 누르면 레시피 뷰어가 열립니다. 도구 모음에서 정렬 방식, 레이아웃 저장 및 이미지 내보내기를 선택할 수 있습니다.
**MOD Settings**를 사용하여 **Overcooked2RecipeViewer**를 설정할 수 있습니다.

## 단축키

| 기능 | 키 / 마우스 |
| --- | --- |
| 뷰어 표시 / 닫기 | **Insert** (기본값, 설정에서 변경 가능) |
| 세로 스크롤 | **마우스 휠** / **PageUp, PageDown** |
| 가로 스크롤 | **Shift + 마우스 휠** |
| 확대/축소 (50%–200%) | **Ctrl + 마우스 휠** |
| 레시피 이동 | 레시피 카드를 드래그 |
| 행 전체 이동 | 행 왼쪽의 핸들을 드래그 |

## 문제 신고

문제가 발생하면 [Issues](https://github.com/foamp/Overcooked2RecipeViewer/issues)에 게임 및 모드 버전, 스테이지와 플레이어 수, 재현 방법, `BepInEx\LogOutput.log`의 관련 로그를 첨부해 주세요. UI 문제의 경우 스크린샷을 함께 첨부하면 좋습니다.'''
note_i18n.ja = """
BepInEx ベースの《Overcooked! 2》レシピビューア MOD です。ゲーム本来のレシピカードを使って現在のレベルの利用可能なレシピをすべて表示し、事前の確認や整理、共有をしやすくします。

**これはレシピの表示・並べ替え・共有ツールです。ビューア内の表示とレイアウトのみを変更し、実際の注文、注文生成ロジック、提供順、タイマー、スコアは変更しません。**

## 機能

- 公式レベルに加え、ゲーム標準のレシピデータを提供するカスタムマップに対応します。
- 現在のレベルのレシピを表示し、調理器具別の並べ替えなど複数の並べ替え方法に対応します。
- レシピの位置や行全体の順序をドラッグで調整でき、レイアウトを自由に整理できます。
- レベルごとにカスタムレイアウトを自動保存し、複数のレイアウトの保存・切り替えもできます。
- スクロール、ズーム、レシピ全体の PNG 書き出し、クリップボードへのコピーに対応します。
- ゲームの言語に応じて中国語または英語のインターフェースを自動的に使用します。

## 使い方

レベルに入った後、`Insert` キーを押すとレシピビューアが開きます。ツールバーから並べ替え方法の選択、レイアウトの保存、画像の書き出しができます。
**Overcooked2RecipeViewer** の設定は《MOD 設定》から行えます。

## ショートカット

| 操作 | キー / マウス |
| --- | --- |
| ビューアの表示 / 閉じる | **Insert**（既定、設定で変更可能） |
| 縦スクロール | **マウスホイール** / **PageUp、PageDown** |
| 横スクロール | **Shift + ホイール** |
| ズーム（50%–200%） | **Ctrl + ホイール** |
| レシピの移動 | レシピカードをドラッグ |
| 行全体の移動 | 行の左側のハンドルをドラッグ |

## 問題報告

問題が発生した場合は [Issues](https://github.com/foamp/Overcooked2RecipeViewer/issues) にアクセスし、ゲームと MOD のバージョン、レベルと人数、再現手順、`BepInEx\\LogOutput.log` の関連ログを添えてください。UI の問題はスクリーンショットがあると助かります。
"""
