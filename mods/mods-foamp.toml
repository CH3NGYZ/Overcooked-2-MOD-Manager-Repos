note_i18n.ru = '''
Мод BepInEx для просмотра рецептов в Overcooked! 2. Он использует оригинальные карты рецептов игры для отображения всех доступных рецептов на текущем уровне, что облегчает их просмотр, организацию и обмен.

**Это инструмент просмотра рецептов, организации и совместного использования. Он только изменяет дисплей и макет зрителя и не изменяет фактические заказы, генерацию заказов, порядок обслуживания, таймеры или оценки.**

## Особенности

- Поддерживает официальные уровни и пользовательские карты, которые предоставляют стандартные данные о рецептах игр.
- Просмотрите рецепты, доступные на текущем уровне, с несколькими вариантами сортировки, включая сортировку по прибору.
- Перетащите рецепты, чтобы переставить свои позиции и переупорядочить целые ряды.
- Автоматически сохраняет пользовательские макеты для каждого уровня с поддержкой сохранения и переключения между несколькими макетами.
- Поддерживает прокрутку, масштабирование, экспорт полного макета рецепта в виде PNG и копирование его в буфер обмена.
- Автоматически использует китайский или английский язык на основе языка игры.

## использование

Введите уровень и нажмите клавишу `Insert`, чтобы открыть Recipe Viewer. Используйте панель инструментов для выбора вариантов сортировки, сохранения макетов и экспорта изображений.
