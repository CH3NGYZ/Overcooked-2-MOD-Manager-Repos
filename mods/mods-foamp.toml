note_i18n.en = '''
A BepInEx mod for viewing recipes in Overcooked! 2. It uses the game's original recipe cards to display all available recipes in the current level, making them easier to view, organize, and share.

**This is a recipe viewing, organization, and sharing tool. It only changes the display and layout of the viewer and does not change actual orders, order generation, serving order, timers, or scores.**

## Features

- Supports official levels and custom maps that provide standard game recipe data.
- View recipes available in the current level with multiple sorting options, including sorting by appliance.
- Drag recipes to rearrange their positions and reorder entire rows.
- Automatically saves custom layouts for each level, with support for saving and switching between multiple layouts.
- Supports scrolling, zooming, exporting the complete recipe layout as PNG, and copying it to the clipboard.
- Automatically uses Chinese or English based on the game's language.

## Usage

Enter a level and press the `Insert` key to open the Recipe Viewer. Use the toolbar to select sorting options, save layouts, and export images.
You can use **MOD Settings** to configure **Overcooked2RecipeViewer**.

## Shortcuts

| Action | Key / Mouse |
| --- | --- |
| Show / hide viewer | **Insert** (default, configurable) |
| Vertical scrolling | **Mouse Wheel** / **PageUp, PageDown** |
| Horizontal scrolling | **Shift + Mouse Wheel** |
| Zoom (50%–200%) | **Ctrl + Mouse Wheel** |
| Move recipe | Drag a recipe card |
| Move entire row | Drag the handle on the left side of a row |

## Bug Reports

If you encounter a problem, please visit [Issues](https://github.com/foamp/Overcooked2RecipeViewer/issues) and include the game and mod versions, level and player count, reproduction steps, and relevant logs from `BepInEx\LogOutput.log`. Screenshots are helpful for UI issues.'''
note_i18n.de = '''
Ein BepInEx-Mod zum Anzeigen von Rezepten in Overcooked! 2. Er verwendet die Originalrezeptkarten des Spiels, um alle verfügbaren Rezepte in der aktuellen Ebene anzuzeigen, so dass sie leichter angezeigt, organisiert und geteilt werden können.

**Dies ist ein Rezept-Anzeige-, Organisations- und Freigabe-Tool. Es ändert nur die Anzeige und das Layout des Betrachters und ändert nicht die tatsächlichen Bestellungen, Auftragsgenerierung, Serving Order, Timer oder Scores.**

## Merkmale

- Unterstützt offizielle Levels und benutzerdefinierte Karten, die Standard-Spielrezeptdaten liefern.
- Zeigen Sie Rezepte an, die auf der aktuellen Ebene mit mehreren Sortieroptionen verfügbar sind, einschließlich Sortieren nach Appliance.
- Ziehen Sie Rezepte, um ihre Positionen neu zu ordnen und ganze Zeilen neu zu ordnen.
- Speichert automatisch benutzerdefinierte Layouts für jede Ebene, mit Unterstützung zum Speichern und Wechseln zwischen mehreren Layouts.
- Unterstützt das Scrollen, Zoomen, Exportieren des kompletten Rezeptlayouts als PNG und Kopieren in die Zwischenablage.
- Verwenden Sie automatisch Chinesisch oder Englisch basierend auf der Sprache des Spiels.

## Nutzung

Geben Sie eine Ebene ein und drücken Sie die `Insert`-Taste, um den Rezept-Viewer zu öffnen. Verwenden Sie die Symbolleiste, um Sortieroptionen auszuwählen, Layouts zu speichern und Bilder zu exportieren.
Sie können **MOD Settings** verwenden, um **Overcooked2RecipeViewer** zu konfigurieren.

## Abkürzungen

| Aktion | Schlüssel/Maus |
| --- | --- |
| Show/Hide Viewer | **Insert** (Standard, konfigurierbar) |
| Vertikales Scrollen | **Mausrad** / **PageUp, PageDown** |
| Horizontales Scrollen | **Shift + Mausrad** |
| Zoom (50 %–200 %) | **Ctrl + Mausrad** |
| Verschieberezeptur | Ziehen Sie eine Rezeptkarte |
| Verschieben Sie die ganze Zeile | Ziehen Sie den Griff auf der linken Seite einer Reihe |

## Bug-Berichte

Wenn Sie auf ein Problem stoßen, besuchen Sie bitte [Issues](https://github.com/foamp/Overcooked2RecipeViewer/issues) und fügen Sie die Spiel- und Mod-Versionen, Level- und Spieleranzahl, Wiedergabeschritte und relevante Protokolle von `BepInEx\LogOutput.log` hinzu. Screenshots sind hilfreich für UI-Probleme.
'''
note_i18n.fr = '''
Un mod BepInEx pour visualiser les recettes en Overcooked! 2. Il utilise les cartes de recettes originales du jeu pour afficher toutes les recettes disponibles au niveau actuel, les rendant plus faciles à voir, à organiser et à partager.

**Il s'agit d'un outil de visualisation, d'organisation et de partage de recettes. Il ne change que l'affichage et la mise en page du spectateur et ne modifie pas les commandes réelles, la génération de commandes, la commande de service, les minuteries ou les scores.**

