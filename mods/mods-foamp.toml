note_i18n.es-ES = '''
Un mod BepInEx para ver recetas en Overcooked! 2. Utiliza las tarjetas de receta originales del juego para mostrar todas las recetas disponibles en el nivel actual, haciéndolas más fáciles de ver, organizar y compartir.

