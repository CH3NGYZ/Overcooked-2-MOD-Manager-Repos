'''
note_i18n.pl = '''
BepInEx mod do przeglądania przepisów w Overcooked! 2. Używa oryginalnych kart receptur gry, aby wyświetlić wszystkie dostępne przepisy na obecnym poziomie, ułatwiając im oglądanie, organizowanie i udostępnianie.

