# Cookbook Codex · Edição Lite

Um guia de receita e ajudante de nível para Overcooked! 2, com correções de placa para mapas grandes, receitas na tela e configurações por nível.

## Início rápido

Depois de instalar, inicie o jogo e pressione **F6** para abrir o painel. Você pode mudar a tecla de atalho. Para uma caminhada, veja o [tutorial no RedNote](https://www.xiaohongshu.com/explore/6afe4a3e000000001802dfa9).

## Características

- **Plate corriges para grandes mapas:** Addresses placas exibindo incorretamente, desaparecendo quando deixado cair, ou aparecendo como azulejos brancos em branco.
- **Recipe procura e sobreposições:** Procure receitas comuns, leia nomes de pratos de níveis personalizados e organize as receitas do nível atual na tela.
- **Star celebrações e medalhas:** Escolha um alvo de fogos de artifício de 1 a 5 estrelas. O alvo de 5 estrelas é 500 pontos acima de 4 estrelas; atingindo 5 a 7 estrelas exibe uma medalha na tela de resultados.
- **Camera e controles HUD:** Salve quatro visualizações específicas de posição e uma visão global. Ajuste a altura da barra de cozinha e redimensione ou mova o placar, contagem regressiva, cartões de pedidos e ícones acima dos potes.
- **Configurações por nível:** Cada nível se lembra de suas próprias configurações.

Ajudas opcionais, tais como corte mais rápido a solo, assistência de lançamento, retorno rápido do item e o super extintor estão desligados por padrão. O jogo se lembra de qualquer alternância ativada.

## Configuração

- Na primeira execução, o mod cria `厨神秘典配置.txt` na sua pasta de plug-ins. Use o padrão ou edite o arquivo em um editor de texto.
- Para layouts de menu prontos cobrindo mais de 100 níveis, peça ao autor do grupo Codex um arquivo de configuração e substitua o arquivo com o mesmo nome.

## Actualizações em linha

Quando uma nova versão estiver disponível, siga o prompt no jogo para atualizar sem reinstalar.

> **Não mover ou renomear a pasta plugin.** O updater precisa encontrá-lo em sua localização original.

Use o mod para se divertir e praticar. Por favor, não o use para fazer as pontuações de fazenda ou interromper outros jogadores.
