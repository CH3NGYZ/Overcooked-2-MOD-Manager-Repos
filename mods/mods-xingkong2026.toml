## 주요 기능

- **대형 맵 접시 수정:** 접시가 제대로 표시되지 않거나, 떨어뜨리면 사라지거나, 흰색 판으로 보이는 문제를 수정합니다.
- **레시피 조회 및 화면 표시:** 자주 쓰는 레시피를 조회하고 커스텀 레벨의 요리 이름을 읽어, 현재 레벨의 레시피를 화면에 배치할 수 있습니다.
- **별점 축하와 메달:** 별 1~5개 중 불꽃놀이 목표를 선택할 수 있습니다. 별 5개는 별 4개보다 500점이 높고, 별 5~7개에 해당하는 점수에 도달하면 결과 화면에 메달이 표시됩니다.
- **시점과 HUD:** 위치별 시점 4개와 공통 시점 1개를 저장할 수 있습니다. 조리 바의 높이와 점수판, 타이머, 주문 카드, 냄비 위 아이콘의 크기와 위치를 조정할 수 있습니다.
- **레벨별 설정 저장:** 각 레벨의 설정을 따로 기억합니다.

혼자 플레이할 때 빠르게 썰기, 던지기 보조, 아이템 빠른 복귀, 강화 소화기 등의 편의 기능은 기본적으로 꺼져 있습니다. 켜거나 끈 상태는 자동으로 저장됩니다.

