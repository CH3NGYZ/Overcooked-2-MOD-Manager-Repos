- **星級慶祝與廚神勳章**：可選 1～5 星煙火慶祝，5 星門檻比 4 星高 500 分；達到 5～7 星時，結算畫面會顯示廚神勳章。
- **視角與介面**：可儲存 4 個位置視角及 1 個全域視角，遊戲內位置會跟隨視角。可調整烹飪條的上下位置，以及計分板、倒數計時、訂單卡片和鍋上圖示的大小與位置。
- **按關卡儲存**：每個關卡獨立記住設定。

單人切菜加速、投擲輔助、物品快速返回和超級滅火器等便利功能預設關閉。按需開啟後，遊戲會自動記住開關狀態。

## 設定

