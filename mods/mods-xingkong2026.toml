note_i18n.en = """
# Cookbook Codex · Lite Edition

A recipe guide and level helper for Overcooked! 2, with plate fixes for large maps, on-screen recipes, and per-level settings.

## Quick start

After installing, launch the game and press **F6** to open the panel. You can change the hotkey. For a walkthrough, see the [RedNote tutorial](https://www.xiaohongshu.com/explore/6afe4a3e000000001802dfa9).

## Features

- **Plate fixes for large maps:** Addresses plates displaying incorrectly, disappearing when dropped, or appearing as blank white tiles.
- **Recipe lookup and overlays:** Look up common recipes, read dish names from custom levels, and arrange the current level's recipes on screen.
- **Star celebrations and medals:** Choose a fireworks target from 1 to 5 stars. The 5-star target is 500 points above 4 stars; reaching 5 to 7 stars displays a medal on the results screen.
- **Camera and HUD controls:** Save four position-specific views and one global view. Adjust the cooking bar's height and resize or move the scoreboard, countdown, order cards, and icons above pots.
- **Per-level settings:** Each level remembers its own settings.

Optional assists such as faster solo chopping, throwing assistance, quick item return, and the super extinguisher are off by default. The game remembers any toggles you enable.

## Configuration

- On first run, the mod creates `厨神秘典配置.txt` in its plugin folder. Use the defaults or edit the file in a text editor.
- For ready-made menu layouts covering more than 100 levels, ask the author in the Codex group for a configuration file and replace the file with the same name.

## Online updates

When a new version is available, follow the in-game prompt to update without reinstalling.

> **Do not move or rename the plugin folder.** The updater needs to find it in its original location.

Use the mod for fun and practice. Please do not use it to farm scores or disrupt other players.
"""
