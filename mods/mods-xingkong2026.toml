Nach der Installation starten Sie das Spiel und drücken Sie **F6** Um das Panel zu öffnen, können Sie den Hotkey ändern. [RedNote-Anleitung](https://www.xiaohongshu.com/explore/6afe4a3e000000001802dfa9).

