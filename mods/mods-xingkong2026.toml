- **Plate behebt für große Karten: ** Adressen Platten, die falsch angezeigt werden, verschwinden, wenn sie fallen gelassen werden oder als leere weiße Kacheln erscheinen.
- **Recipe Lookup und Overlays: ** Suchen Sie nach gängigen Rezepten, lesen Sie Gerichtsnamen aus benutzerdefinierten Levels und ordnen Sie die Rezepte des aktuellen Levels auf dem Bildschirm an.
- **Star Feiern und Medaillen:** Wählen Sie ein Feuerwerksziel von 1 bis 5 Sternen. Das 5-Sterne-Ziel liegt 500 Punkte über 4 Sternen; das Erreichen von 5 bis 7 Sternen zeigt eine Medaille auf dem Ergebnisbildschirm an.
