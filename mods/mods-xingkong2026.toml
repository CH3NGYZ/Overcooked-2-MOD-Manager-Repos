note_i18n.zh-CN = """
# 厨神秘典 · 轻量版

《胡闹厨房 2》的菜谱查询与关卡辅助 MOD，支持大图盘子修复、屏幕菜单和按关卡保存设置。

> **此MOD不是记菜器!**

## 快速上手

安装后启动游戏，按 **F6** 打开面板（默认键，可修改）。首次使用建议先看 [小红书教程](https://www.xiaohongshu.com/explore/6afe4a3e000000001802dfa9)。

## 主要功能

- **大图盘子修复**：处理大型地图上盘子显示不全、落地消失或显示成白板的问题。
- **菜谱查询与贴图**：内置常见菜谱，可读取自制关卡的菜名表，也能将本关菜谱摆在屏幕上随时查看。
- **星级庆祝与厨神勋章**：可选 1～5 星烟花庆祝，5 星门槛比 4 星高 500 分；达到 5～7 星时，结算界面会显示厨神勋章。
- **视角与界面**：可保存 4 个位置视角和 1 个全局视角，游戏内位置会跟随视角。可调烹饪条的上下位置，也可调整记分牌、倒计时、订单卡片和锅上图标的大小与位置。
- **按关卡保存**：每个关卡独立记忆设置。

单人切菜加速、投掷达人、物品快回和超级灭火器等便捷功能默认关闭。按需开启后，游戏会自动记住开关状态。

## 配置

- 首次运行会在插件文件夹生成 `厨神秘典配置.txt`。默认配置可直接使用，也可用记事本编辑。
- 想使用已排好 100 多个关卡的菜单布局，可在秘典群向作者索取配置，覆盖同名文件。

## 在线更新

有新版本时，游戏内会提示更新，按提示操作即可，无需重新安装。

> **请勿移动或重命名插件文件夹**，否则在线更新将找不到插件位置。

本 MOD 仅用于娱乐和练习，请勿用于刷分或影响他人游戏体验。
"""
