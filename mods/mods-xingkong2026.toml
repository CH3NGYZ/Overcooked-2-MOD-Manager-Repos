- **Per-Level-Einstellungen:** Jede Ebene erinnert sich an ihre eigenen Einstellungen.

Optionale Assists wie schnelleres Solohacken, Wurfhilfe, schnelle Artikelrückgabe und der Superlöscher sind standardmäßig ausgeschaltet. Das Spiel erinnert sich an alle Umschalter, die Sie aktivieren.

