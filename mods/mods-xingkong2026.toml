# 쿡북 코덱스 · 라이트 버전

Overcooked! 2의 레시피 조회 및 레벨 보조 모드입니다. 대형 맵의 접시 문제 수정, 화면 레시피 표시, 레벨별 설정을 지원합니다.

## 빠른 시작

설치 후 게임을 실행하고 **F6**을 눌러 패널을 여세요. 단축키는 변경할 수 있습니다. 처음이라면 [샤오홍슈 사용법](https://www.xiaohongshu.com/explore/6afe4a3e000000001802dfa9)을 참고하세요.

## 주요 기능

- **대형 맵 접시 수정:** 접시가 제대로 표시되지 않거나, 떨어뜨리면 사라지거나, 흰색 판으로 보이는 문제를 수정합니다.
- **레시피 조회 및 화면 표시:** 자주 쓰는 레시피를 조회하고 커스텀 레벨의 요리 이름을 읽어, 현재 레벨의 레시피를 화면에 배치할 수 있습니다.
- **별점 축하와 메달:** 별 1~5개 중 불꽃놀이 목표를 선택할 수 있습니다. 별 5개는 별 4개보다 500점이 높고, 별 5~7개에 해당하는 점수에 도달하면 결과 화면에 메달이 표시됩니다.
- **시점과 HUD:** 위치별 시점 4개와 공통 시점 1개를 저장할 수 있습니다. 조리 바의 높이와 점수판, 타이머, 주문 카드, 냄비 위 아이콘의 크기와 위치를 조정할 수 있습니다.
- **레벨별 설정 저장:** 각 레벨의 설정을 따로 기억합니다.

혼자 플레이할 때 빠르게 썰기, 던지기 보조, 아이템 빠른 복귀, 강화 소화기 등의 편의 기능은 기본적으로 꺼져 있습니다. 켜거나 끈 상태는 자동으로 저장됩니다.

## 설정

- 처음 실행할 때 플러그인 폴더에 `厨神秘典配置.txt`가 생성됩니다. 기본 설정을 사용하거나 텍스트 편집기로 수정할 수 있습니다.
- 100개가 넘는 레벨의 메뉴 배치 설정을 사용하려면 코덱스 그룹에서 제작자에게 파일을 받아 같은 이름의 파일을 덮어쓰세요.

## 온라인 업데이트

새 버전이 나오면 게임 내 안내에 따라 다시 설치하지 않고 업데이트할 수 있습니다.

> **플러그인 폴더를 옮기거나 이름을 바꾸지 마세요.** 업데이트가 플러그인을 찾지 못할 수 있습니다.

이 모드는 재미와 연습을 위한 도구입니다. 점수 올리기나 다른 플레이어의 게임을 방해하는 데 사용하지 마세요.
