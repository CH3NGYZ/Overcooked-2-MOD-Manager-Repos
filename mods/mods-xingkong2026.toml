note_i18n.ja = """
# クックブック・コーデックス · ライト版

『Overcooked! 2』のレシピ検索・ステージ補助 MOD です。大型マップでの皿の不具合修正、画面上のレシピ表示、ステージごとの設定保存に対応します。

## はじめに

インストール後にゲームを起動し、**F6** を押すとパネルが開きます。キーは変更できます。初めて使う方は [小紅書のチュートリアル](https://www.xiaohongshu.com/explore/6afe4a3e000000001802dfa9) をご覧ください。

## 主な機能

- **大型マップの皿の修正：** 皿が正しく表示されない、落とすと消える、白い板に見えるといった問題を修正します。
- **レシピ検索と画面表示：** よく使うレシピを検索できます。カスタムステージの料理名を読み取り、そのステージのレシピを画面に配置できます。
- **星のお祝いとメダル：** 星 1～5 の目標を選び、到達時に花火でお祝いします。星 5 は星 4 より 500 点高く、星 5～7 相当のスコアで結果画面にメダルが表示されます。
- **カメラと HUD：** 場所ごとの視点を 4 つ、共通視点を 1 つ保存できます。調理バーの高さや、スコアボード、タイマー、注文カード、鍋の上のアイコンの大きさと位置を調整できます。
- **ステージ別の設定：** ステージごとに設定を保存します。

ソロでのカット高速化、投げる操作の補助、アイテムの素早い復帰、強化消火器などは初期状態ではオフです。切り替えた状態は自動で保存されます。

## 設定

- 初回起動時にプラグインフォルダに `厨神秘典配置.txt` が作成されます。そのまま使うか、テキストエディターで編集できます。
- 100 以上のステージのメニュー配置を利用するには、作者のグループで設定ファイルを入手し、同名のファイルを上書きしてください。

## オンラインアップデート

新しいバージョンが公開されたら、ゲーム内の案内に従って再インストールせずに更新できます。

> **プラグインフォルダの移動・名前変更はしないでください。** 更新時にプラグインの場所が見つからなくなります。

この MOD は遊びと練習のためのものです。スコア稼ぎや、ほかのプレイヤーの迷惑になる使い方は控えてください。
