Po instalacji, uruchomić grę i naciśnij **F6** Aby otworzyć panel. Możesz zmienić klucz. Aby przejść, zobacz [poradnik na RedNote](https://www.xiaohongshu.com/explore/6afe4a3e000000001802dfa9).

