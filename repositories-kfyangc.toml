note_i18n.zh-CN = """优化 `DIYChef（自定义厨师）` 在餐车读取厨师资源文件时的卡顿，减少进入餐车时的等待。
**注意事项：安装后，请手动将 `OC2DIYChef` 目录下的 `Resources` 文件夹和 `prefer.txt` 移动到 `OC2DIYChef-FastInit` 下，与 `DIYChefFastInit.dll` 放在同一目录下。重复文件请选择替换。**"""
note_i18n.zh-TW = """最佳化 `DIYChef（自訂廚師）` 在餐車讀取廚師資源檔案時的卡頓，減少進入餐車時的等待。
**注意事項：安裝後，請手動將 `OC2DIYChef` 目錄下的 `Resources` 資料夾和 `prefer.txt` 移動到 `OC2DIYChef-FastInit` 下，與 `DIYChefFastInit.dll` 放在同一目錄下。若有重複檔案，請選擇取代。**"""
note_i18n.en = """Speeds up `DIYChef` resource loading to reduce the delay when entering the food truck.
**Note: After installation, manually move the `Resources` folder and `prefer.txt` from the `OC2DIYChef` directory into `OC2DIYChef-FastInit`, alongside `DIYChefFastInit.dll`. **"""
note_i18n.ko = """`DIYChef` 리소스 로딩을 가속하여 푸드 트럭 진입 시의 지연을 줄입니다.
**주의사항: 설치 후 `OC2DIYChef` 디렉터리의 `Resources` 폴더와 `prefer.txt`를 `OC2DIYChef-FastInit`으로 직접 옮기고 `DIYChefFastInit.dll`과 같은 폴더에 두세요. 중복 파일이 있으면 바꾸기를 선택하세요.**"""
note_i18n.ja = """`DIYChef` のリソース読み込みを高速化し、フードトラックに入る際の待ち時間を短縮します。
**注意事項：インストール後、`OC2DIYChef` ディレクトリ内の `Resources` フォルダーと `prefer.txt` を手動で `OC2DIYChef-FastInit` へ移動し、`DIYChefFastInit.dll` と同じフォルダーに配置してください。重複ファイルがある場合は「置き換え」を選択してください。**"""
