[[repositories]]
enabled = true
# 仓库基本信息
name_i18n.zh-CN = "自制地图 快速载入 (卡餐车加速)"
name_i18n.zh-TW = "自製地圖 快速載入 (卡餐車加速)"
name_i18n.en = "Custom Maps - Faster Resource Loading"
name_i18n.ko = "커스텀 맵 - 리소스 로딩 가속"
name_i18n.ja = "カスタムマップ - リソース読み込み高速化"
group_i18n.zh-CN = "DIYLevel 优化"
group_i18n.zh-TW = "DIYLevel 優化"
group_i18n.en = "DIYLevel Optimization"
group_i18n.ko = "DIYLevel 최적화"
group_i18n.ja = "DIYLevel 最適化"
provider = "github"
username = "kfyangc"
repository = "Overcooked2-DIYLevelFastInit"
region = ""
platform = ""

# 下载方式
download_mode = "release"

# Release 参数
channel = "all"
max_release_count = 10
download_threads = 1

# 版本资产规则
asset_rules = [{ type = "exact", value = "DIYLevelFastInit.dll" }]

# 本地 MOD 识别绑定
plugin_guid = "oc2.diylevel.fastinit"
local_product_name = "DIYLevelFastInit"
local_original_filename = "DIYLevelFastInit.dll"
version_regex = ""

# 安装目录
install_target = "BepInEx/plugins"

# 仓库备注
note_i18n.zh-CN = """优化 `DIYLevel（自定义地图）` 在餐车读取资源文件时的卡顿，减少进入餐车时的等待。
**注意事项：安装 `1.7.0` 版本后，首次启动游戏进入餐车时会在后台加载并解压地图资源包。耗时根据地图数量从几十秒到几分钟不等，请耐心等待；加载进度请查看屏幕右上角的 `DIY info checking`。**"""
note_i18n.zh-TW = """最佳化 `DIYLevel（自訂地圖）` 在餐車讀取資源檔案時的卡頓，減少進入餐車時的等待。
**注意事項：安裝 `1.7.0` 版本後，首次啟動遊戲進入餐車時會在背景載入並解壓地圖資源包。耗時依地圖數量從數十秒到數分鐘不等，請耐心等待；載入進度請查看螢幕右上角的 `DIY info checking`。**"""
note_i18n.en = """Speeds up `DIYLevel` resource loading to reduce the delay when entering the food truck.
**Note: After installing version `1.7.0`, the first time you launch the game and enter the food truck, map resource packs are loaded and extracted in the background. This may take tens of seconds to several minutes depending on the number of maps. Please wait; check the `DIY info checking` progress in the upper-right corner of the screen.**"""
note_i18n.ko = """`DIYLevel` 리소스 로딩을 가속하여 푸드 트럭 진입 시의 지연을 줄입니다.
**주의사항: `1.7.0` 버전 설치 후 게임을 처음 실행해 푸드 트럭에 들어가면 백그라운드에서 맵 리소스 팩을 불러오고 압축을 풉니다. 맵 수에 따라 수십 초에서 몇 분까지 걸릴 수 있으니 기다려 주세요. 화면 오른쪽 위의 `DIY info checking` 진행 상태를 확인하세요.**"""
note_i18n.ja = """`DIYLevel` のリソース読み込みを高速化し、フードトラックに入る際の待ち時間を短縮します。
**注意事項：バージョン `1.7.0` のインストール後、ゲームを初めて起動してフードトラックに入ると、バックグラウンドでマップリソースパックの読み込みと展開が行われます。マップ数によって数十秒から数分かかる場合がありますので、そのままお待ちください。画面右上の `DIY info checking` の進行状況を確認してください。**"""

# 依赖 DIYLevel
[[repositories.relations]]
kind = "requires"
guid = "dev.gua.overcooked.diylevel"
# 分版本依赖
[[repositories.release_relations]]
version = "==1.7.0"
relations = [
  { kind = "requires", guid = "dev.gua.overcooked.diylevel", version = "==0.10.0" },
]

