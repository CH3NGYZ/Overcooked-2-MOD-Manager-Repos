[[repositories]]
enabled = true
# 仓库基本信息
name_i18n.zh-CN = "DIYLevel Web 前置"
name_i18n.zh-TW = "DIYLevel Web 前置"
name_i18n.en = "DIYLevel Web Runtime"
name_i18n.ko = "DIYLevel Web 런타임"
name_i18n.ja = "DIYLevel Web ランタイム"
group_i18n.zh-CN = "DIYLevel"
group_i18n.zh-TW = "DIYLevel"
group_i18n.en = "DIYLevel"
group_i18n.ko = "DIYLevel"
group_i18n.ja = "DIYLevel"
provider = "github"
username = "guojia99"
repository = "OC2DIYLevelRuntimeWLoader"
region = ""
platform = ""

# 下载方式
download_mode = "release"

# Release 参数
channel = "all"
max_release_count = 10
download_threads = 32

# 版本资产规则
# 资产名形如 `v3.10.2_OC2DIYLevelRuntimeWLoader.zip`
asset_rules = [
  { type = "glob", value = "*_OC2DIYLevelRuntimeWLoader.zip" },
]

# 本地 MOD 识别绑定
plugin_guid = "oc2.oc2diylevelruntimewloader"
local_product_name = ""
local_original_filename = "Loader.dll"
version_regex = ""

# 安装目录
# 压缩包顶层就是 `OC2DIYLevelRuntimeWLoader/` 单目录，按本项目布局规则会
# 完整放进 plugins（保留目录名），与框架预期的 `plugins/OC2DIYLevelRuntimeWLoader`
# 一致。
install_target = "BepInEx/plugins"

# 仓库备注
note_i18n.zh-CN = '''
# DIYLevel Web 前置（DIYLevelRuntimeWLoader）

用**嘉吖老师的 WebEditor** 导出的自制地图，需要先安装此前置才能正常加载。
只玩普通自制地图的用户不需要它。

## 什么时候需要

| 地图来源 | 是否需要此前置 |
| --- | --- |
| WebEditor 导出、带 `webcustomstub_runtime` 目录的地图 | **需要** |
| 手工制作或早期导出、不依赖运行时脚本的地图 | 不需要 |

拿不准时可以装上再试：如果进入关卡正常、没有报错，就说明地图需要它；
如果完全正常且不需要，关掉它能少一层兼容性风险。

## 依赖关系

- 此前置**必须**配合 `DIYLevel` 自定义关卡框架使用，单独安装无效。
  管理器会把它标记为依赖 DIYLevel，未安装 DIYLevel 时安装流程会先提示。
- 安装后由 DIYLevel 在加载地图时调用。

## 安装

1. 先安装 **DIYLevel - 自定义关卡** 框架。
2. 安装此前置。
3. 把需要游玩的地图放进 `BepInEx/plugins/OC2DIYLevel/levels/`。

## 注意事项

- 压缩包内有 `version.txt` 与 `log_config.txt`，可与 Release 版本对照排查。
- 需要调试时，`debugLog.dll` 与 `log_config.txt` 用于输出运行时日志。
- 若安装后某些**不需要**此前置的地图出现问题，先在 MOD 管理器中关闭
  此前置再试 —— 部分地图与运行时脚本存在兼容性冲突。
- 地图选档列表为空等异常，先确认 DIYLevel 本身正常、地图放在正确目录，
  再逐个移除以定位是哪张地图导致。

## 问题反馈

问题请反馈到 [Issues](https://github.com/guojia99/OC2DIYLevelRuntimeWLoader/issues)，
并附上游戏版本、此前置版本、地图名称，以及 `BepInEx/LogOutput.log` 的相关日志。
'''

