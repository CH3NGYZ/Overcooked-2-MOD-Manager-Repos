note_i18n.en = '''
# DIYLevel Web Runtime (DIYLevelRuntimeWLoader)

Custom maps exported from **Master Jiaya's WebEditor** need this runtime installed
before they can load. You do not need it for ordinary custom maps.

## When it is required

| Map source | Needs this runtime |
| --- | --- |
| Exported from WebEditor, ships a `webcustomstub_runtime` folder | **Yes** |
| Hand-made or older exports without runtime scripts | No |

If you are unsure, install it and try: a level that loads without errors needs it;
if everything works without it, leaving it disabled removes a layer of
compatibility risk.

## Dependency

- This runtime **requires** the `DIYLevel` custom-level framework. Installing it
  alone does nothing. The manager marks it as depending on DIYLevel, and the
  install flow warns when DIYLevel is missing.
- Once installed, DIYLevel calls it while loading maps.

## Installation

1. Install the **DIYLevel - Custom Levels** framework first.
2. Install this runtime.
3. Put the maps you want to play into `BepInEx/plugins/OC2DIYLevel/levels/`.

## Notes

- The archive ships `version.txt` and `log_config.txt`; use them to compare
  against the Release version when troubleshooting.
- For debugging, `debugLog.dll` and `log_config.txt` control runtime logging.
- If maps that do **not** need this runtime break after installing it, disable it
  in MOD Manager first — some maps conflict with the runtime scripts.
- For an empty level slot list, first confirm DIYLevel itself works and the maps
  are in the right folder, then remove maps one by one to find the culprit.

## Support

Report issues at [Issues](https://github.com/guojia99/OC2DIYLevelRuntimeWLoader/issues)
with the game version, runtime version, map name, and the relevant lines from
`BepInEx/LogOutput.log`.
'''

note_i18n.ko = '''
# DIYLevel Web 런타임 (DIYLevelRuntimeWLoader)

**자야(Gua) 선생님의 WebEditor**로 내보낸 커스텀 맵은 이 런타임을 먼저 설치해야
정상적으로 불러올 수 있습니다. 일반 커스텀 맵만 즐긴다면 필요하지 않습니다.

## 필요한 경우

| 맵 출처 | 이 런타임 필요 여부 |
| --- | --- |
| WebEditor로 내보내고 `webcustomstub_runtime` 폴더가 포함된 맵 | **필요** |
| 직접 제작했거나 런타임 스크립트에 의존하지 않는 맵 | 불필요 |

확실하지 않다면 설치 후 시험해 보세요. 오류 없이 레벨이 열리면 필요한 맵이고,
없어도 정상이라면 비활성화해 호환성 위험을 줄이는 편이 좋습니다.

## 의존 관계

- 이 런타임은 `DIYLevel` 커스텀 레벨 프레임워크가 **반드시** 필요합니다.
  단독 설치로는 동작하지 않으며, 관리자가 DIYLevel 의존으로 표시합니다.
- 설치 후 DIYLevel이 맵을 불러올 때 호출합니다.

## 설치

1. **DIYLevel - 커스텀 레벨** 프레임워크를 먼저 설치합니다.
2. 이 런타임을 설치합니다.
3. 플레이할 맵을 `BepInEx/plugins/OC2DIYLevel/levels/`에 넣습니다.

## 참고

- 압축 파일에 `version.txt`와 `log_config.txt`가 포함되어 있어 Release 버전과
  대조하며 문제를 확인할 수 있습니다.
- 디버깅 시 `debugLog.dll`과 `log_config.txt`가 런타임 로그를 담당합니다.
- 이 런타임이 **필요 없는** 맵에서 문제가 생기면 MOD 관리자에서 먼저 비활성화해
  보세요. 일부 맵은 런타임 스크립트와 충돌합니다.
- 레벨 선택 목록이 비어 있다면 DIYLevel 자체가 정상인지, 맵이 올바른 폴더에
  있는지 확인한 뒤 맵을 하나씩 제거해 원인을 찾으세요.

## 문제 신고

[Issues](https://github.com/guojia99/OC2DIYLevelRuntimeWLoader/issues)에 게임 버전,
런타임 버전, 맵 이름과 `BepInEx/LogOutput.log`의 관련 로그를 첨부해 주세요.
'''

note_i18n.ja = '''
# DIYLevel Web ランタイム（DIYLevelRuntimeWLoader）

**嘉吖先生の WebEditor** から書き出したカスタムマップは、このランタイムを
先にインストールしないと正常に読み込めません。通常のカスタムマップだけを
遊ぶ場合は不要です。

## 必要なケース

| マップの出所 | このランタイムの要否 |
| --- | --- |
| WebEditor で書き出し、`webcustomstub_runtime` を含むマップ | **必要** |
| 手作り、またはランタイムスクリプトに依存しないマップ | 不要 |

判断に迷う場合はインストールして試してください。エラーなくレベルに入れれば
必要なマップで、不要でも正常に動くなら無効化しておくと互換性リスクを減らせます。

## 依存関係

- このランタイムは `DIYLevel` カスタムレベルフレームワークが**必須**です。
  単体では動作せず、マネージャーは DIYLevel 依存として表示します。
- インストール後は DIYLevel がマップ読み込み時に呼び出します。

## インストール

1. **DIYLevel - カスタムレベル** フレームワークを先にインストールします。
2. このランタイムをインストールします。
3. 遊ぶマップを `BepInEx/plugins/OC2DIYLevel/levels/` に置きます。

## 注意

- アーカイブには `version.txt` と `log_config.txt` が含まれ、Release の
  バージョンと照合して原因を確認できます。
- デバッグ時は `debugLog.dll` と `log_config.txt` がログ出力を担当します。
- このランタイムが**不要な**マップで問題が出た場合は、MOD マネージャーで
  先に無効化してください。一部のマップはランタイムスクリプトと競合します。
- レベル選択リストが空になる場合は、DIYLevel 自体が正常か、マップが正しい
  フォルダーにあるかを確認し、マップを 1 つずつ外して原因を探してください。

## フィードバック

問題は [Issues](https://github.com/guojia99/OC2DIYLevelRuntimeWLoader/issues) へ、
ゲームのバージョン、ランタイムのバージョン、マップ名、`BepInEx/LogOutput.log`
の関連ログを添えて報告してください。
'''

