note_i18n.zh-CN = """
困难敌群 MOD，可以提高敌群难度。
- 在游戏主菜单“设置 - MOD”中启用，默认不启用。
- 只需主机启用即可生效，包括街机模式。
- 所有敌人都需要多吃一份订单（僵尸面包和辣椒需要两份，苹果需要三份）。
- 每波结束后，不再等待所有敌人被击败就会开始下一波。
- 菜单生成规则会从独立随机改为普通关卡的生成规则。"""
note_i18n.zh-TW = """
困難敵群 MOD，可以提高敵群難度。
- 在遊戲主選單「設定 - MOD」中啟用，預設為關閉。
- 只需主機啟用即可生效，包括街機模式。
- 所有敵人都需要多吃一份訂單（殭屍麵包和辣椒需要兩份，蘋果需要三份）。
- 每波結束後，不再等待所有敵人被擊敗就會開始下一波。
- 選單生成規則會從獨立隨機改為一般關卡的生成規則。"""
note_i18n.en = """
Hard Horde increases the difficulty of horde levels.
- Enable in the game main menu under Settings - MOD (disabled by default).
- Only the host needs to enable it, including in arcade mode.
- All enemies require one extra order (two for zombie breads and chilies, three for apples).
- At the end of each wave, the next wave starts without waiting for all enemies to be defeated.
- Menu generation changes from independent random generation to the normal level generation rules."""
note_i18n.ko = """
적 무리 레벨의 난이도를 높이는 MOD입니다.
- 게임 메인 메뉴의 설정 - MOD에서 활성화하세요(기본값은 비활성화).
- 아케이드 모드를 포함해 호스트만 활성화하면 됩니다.
- 모든 적은 주문을 하나 더 먹어야 합니다(좀비 빵과 고추는 두 개, 사과는 세 개).
- 각 웨이브가 끝나면 모든 적이 처치될 때까지 기다리지 않고 다음 웨이브가 시작됩니다.
- 메뉴 생성 규칙이 독립적인 무작위 방식에서 일반 레벨의 생성 규칙으로 바뀝니다."""
