# 仓库备注
note = """
可以通过指定按键起飞。使用前先在按键设置中设置起飞键，选项名为 Jet。
- 键盘和分体键盘玩家可直接设置 Jet 键；手柄玩家需要在这里设置一个键，再到“Steam - 库 - Overcooked! 2 - 控制器布局”将手柄按键映射到该键。
- 长按 Jet 键起飞，短按 Jet 键固定高度巡航。
- 客机只有在主机也安装此 MOD 时才能生效。
- 游戏启动时默认禁用，也可以在按键设置时按 Esc 禁用；禁用时不会改变原版游戏逻辑。
- 在“街机公开”中无效。
- 启用后重力会变为原来的五分之一，所有天花板会被移除，因此有许多不按 Jet 键也能升空的方法。
"""
note_i18n.en = """
Fly using a configurable key. Set the takeoff key named Jet in the game key setup first.
- Keyboard and split-keyboard players can set Jet directly. Gamepad players must set a keyboard key here, then map the gamepad button to it in Steam - Library - Overcooked! 2 - Controller Layout.
- Hold Jet to take off; tap Jet to fixed height cruise.
- Clients only work when the host also has this MOD installed.
- Jet is disabled by default when the game starts. You can also press Esc during key setup to disable it; disabled mode does not change the original game logic.
- Not valid in Arcade Public.
- When enabled, gravity becomes one fifth of its original value and all ceilings are removed, so there are many ways to get airborne without pressing Jet."""
note_i18n.ko = """
지정한 키로 비행할 수 있습니다. 먼저 키 설정에서 Jet이라는 이륙 키를 지정하세요.
- 키보드와 분할 키보드 사용자는 Jet 키를 바로 설정할 수 있습니다. 게임패드 사용자는 여기서 키보드 키를 지정한 뒤 Steam - 라이브러리 - Overcooked! 2 - 컨트롤러 레이아웃에서 게임패드 버튼을 해당 키에 매핑해야 합니다.
- Jet 키를 길게 누르면 이륙하고 짧게 누르면 고도를 고정하여 순항합니다.
- 호스트에도 이 MOD가 설치되어 있어야 클라이언트에서 작동합니다.
- 게임 시작 시 기본적으로 비활성화됩니다. 키 설정 중 Esc를 눌러 비활성화할 수도 있으며, 비활성화 상태에서는 원래 게임 로직이 바뀌지 않습니다.
- Arcade Public에서는 사용할 수 없습니다.
- 활성화하면 중력이 원래의 5분의 1로 바뀌고 모든 천장이 제거되어 Jet 키를 누르지 않고도 공중에 뜰 수 있는 방법이 많아집니다."""
note_i18n.zh-CN = """
可以通过指定按键起飞。使用前先在按键设置中设置起飞键，选项名为 Jet。
- 键盘和分体键盘玩家可直接设置 Jet 键；手柄玩家需要在这里设置一个键，再到“Steam - 库 - Overcooked! 2 - 控制器布局”将手柄按键映射到该键。
- 长按 Jet 键起飞，短按 Jet 键固定高度巡航。
- 客机只有在主机也安装此 MOD 时才能生效。
- 游戏启动时默认禁用，也可以在按键设置时按 Esc 禁用；禁用时不会改变原版游戏逻辑。
- 在“街机公开”中无效。
- 启用后重力会变为原来的五分之一，所有天花板会被移除，因此有许多不按 Jet 键也能升空的方法。"""
note_i18n.zh-TW = """
可以透過指定按鍵起飛。使用前先在按鍵設定中設定起飛鍵，選項名稱為 Jet。
- 鍵盤和分離式鍵盤玩家可直接設定 Jet 鍵；手把玩家需要在這裡設定一個按鍵，再到「Steam - 收藏庫 - Overcooked! 2 - 控制器配置」將手把按鍵對應到該鍵。
- 長按 Jet 鍵起飛，短按 Jet 鍵固定高度巡航。
- 客機只有在主機也安裝此 MOD 時才能生效。
- 遊戲啟動時預設停用，也可以在按鍵設定時按 Esc 停用；停用時不會改變原版遊戲邏輯。
- 在「街機公開」中無效。
- 啟用後重力會變為原本的五分之一，所有天花板都會移除，因此有許多不按 Jet 鍵也能升空的方法。"""

