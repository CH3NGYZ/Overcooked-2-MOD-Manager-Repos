# 仓库备注
note = """
可以投掷盘子等游戏原本不能投掷的物品，也可以抬起并投掷其他厨师。
- 投掷达人：可以投掷除灭火器、水枪、奶油、呼呼外的任何物品。
- 投掷人：可以抬起和投掷其他厨师，客机效果受延迟影响较大。
- 在游戏主菜单“设置 - MOD”中启用，默认不启用。
- 主机安装后可自行生效；联机时主机需要安装并启用，主客机都启用后客机才能投掷。
- 进入“街机公开”时功能会自动关闭，以免影响其他玩家。
"""
note_i18n.en = """
Throw normally unthrowable items such as plates, and pick up and throw other chefs.
- Throw Master: throw any item except fire extinguishers, water guns, cream, and whoopee cushions.
- Throw Person: pick up and throw other chefs; client behavior can be affected by latency.
- Enable it in the game main menu under Settings - MOD. It is disabled by default.
- The host can use it after installing it. In multiplayer, the host must install and enable it; both host and client must enable it for clients to throw.
- The feature is automatically disabled in Arcade Public to avoid affecting other players."""
note_i18n.ko = """
접시처럼 원래 던질 수 없는 물건을 던지고 다른 셰프를 들어서 던질 수 있습니다.
- 투척 달인: 소화기, 물총, 크림, 방귀 쿠션을 제외한 모든 물건을 던집니다.
- 투척인: 다른 셰프를 들어서 던질 수 있으며, 클라이언트 동작은 지연의 영향을 크게 받을 수 있습니다.
- 게임 메인 메뉴의 설정 - MOD에서 활성화하세요. 기본값은 비활성화입니다.
- 호스트는 설치 후 사용할 수 있습니다. 멀티플레이에서는 호스트가 설치하고 활성화해야 하며, 클라이언트가 던지려면 양쪽 모두 활성화해야 합니다.
- 다른 플레이어에게 영향을 주지 않도록 Arcade Public에서는 자동으로 비활성화됩니다."""
note_i18n.zh-CN = """
可以投掷盘子等游戏原本不能投掷的物品，也可以抬起并投掷其他厨师。
- 投掷达人：可以投掷除灭火器、水枪、奶油、呼呼外的任何物品。
- 投掷人：可以抬起和投掷其他厨师，客机效果受延迟影响较大。
- 在游戏主菜单“设置 - MOD”中启用，默认不启用。
- 主机安装后可自行生效；联机时主机需要安装并启用，主客机都启用后客机才能投掷。
- 进入“街机公开”时功能会自动关闭，以免影响其他玩家。"""
note_i18n.zh-TW = """
可以投擲盤子等遊戲原本不能投擲的物品，也可以抬起並投擲其他廚師。
- 投擲達人：可以投擲除滅火器、水槍、奶油、呼呼以外的任何物品。
- 投擲人：可以抬起並投擲其他廚師，客機效果較容易受到延遲影響。
- 在遊戲主選單「設定 - MOD」中啟用，預設為關閉。
- 主機安裝後可自行生效；連線遊玩時主機需要安裝並啟用，主客機都啟用後客機才能投擲。
- 進入「街機公開」時功能會自動關閉，以免影響其他玩家。"""

