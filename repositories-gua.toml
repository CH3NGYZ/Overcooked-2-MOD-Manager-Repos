- 아케이드 모드를 포함해 호스트만 활성화하면 됩니다.
- 모든 적은 주문을 하나 더 먹어야 합니다(좀비 빵과 고추는 두 개, 사과는 세 개).
- 각 웨이브가 끝나면 모든 적이 처치될 때까지 기다리지 않고 다음 웨이브가 시작됩니다.
- 메뉴 생성 규칙이 독립적인 무작위 방식에서 일반 레벨의 생성 규칙으로 바뀝니다."""
