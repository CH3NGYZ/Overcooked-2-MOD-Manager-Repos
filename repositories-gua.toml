# 🗺️ 自定义地图框架与依赖说明

安装自定义地图框架后，即可游玩社区制作的自定义关卡！

## 一、依赖关系图

```mermaid
flowchart TD
    A["🎮 游玩自定义地图"]
    B["安装 `OC2DIYLevel`<br/>自定义地图框架（必装）"]
    C["将地图放入<br/>`OC2DIYLevel/levels`"]
    D{"地图是否需要安装前置？"}
    E["直接游玩"]
    F["额外下载嘉吖老师的<br/>`DIYLevelRuntimeWLoader` 前置"]
    G["游玩需要该前置的地图"]

    A --> B
    B --> C
    C --> D
    D -->|不需要| E
    D -->|需要| F
    F --> G

    style B fill:#d9ead3,stroke:#38761d,color:#000
    style C fill:#cfe2f3,stroke:#1155cc,color:#000
    style F fill:#fce5cd,stroke:#b45f06,color:#000
    style E fill:#d9ead3,stroke:#38761d,color:#000
```

## 二、组件说明

| 组件 | 是否必需 | 说明 |
|---|---|---|
| `OC2DIYLevel` | **必装** | 自定义地图的基础框架，没有它就无法游玩自定义地图。 |
| `OC2DIYLevel/levels` | **必须使用** | 所有需要游玩的自定义地图都必须放在此目录中。 |
| `DIYLevelRuntimeWLoader` | **部分地图需要** | 由嘉吖老师编写的 Web 统一前置，为依赖该组件的自定义地图提供加载支持。 |

## 三、安装与使用建议

1. **安装主框架：** 安装 `OC2DIYLevel` 自定义地图框架。
2. **放置地图：** 将所有需要游玩的自定义地图放入 `OC2DIYLevel/levels` 目录。
3. **检查地图前置：** 确认地图是否需要 `DIYLevelRuntimeWLoader` 前置。需要安装前置的地图，请额外下载嘉吖老师的 `DIYLevelRuntimeWLoader` 前置。

> **⚠️ 兼容性建议**
> 如果当前游玩的地图不需要 `DIYLevelRuntimeWLoader`，建议在 MOD 管理器中关闭该前置，以减少兼容性冲突。
> 如果有地图需要该前置，请再打开，否则地图可能无法正常加载。

## 四、常见问题与故障排查

如果出现以下问题，请优先检查 `OC2DIYLevel`、`DIYLevelRuntimeWLoader` 与 `OC2DIYLevel/levels` 内地图之间的兼容性：

- 进入游戏后，选档列表为空。
- 使用街机 MOD 的 `一键重开` 或 `一键退出` 功能后，游戏卡死或客机全部掉出。

### 推荐排查顺序

1. 确认 `OC2DIYLevel` 已正确安装。
2. 确认所有自定义地图均放在 `OC2DIYLevel/levels` 目录中。
3. 检查地图是否依赖 `DIYLevelRuntimeWLoader`。
4. 如果地图不需要该前置，尝试关闭前置后重新测试。
5. 如果问题仍然存在，逐个移除地图，排查地图与框架之间的兼容性问题。

## 五、社区交流
**胡闹厨房制造所（QQ 四群）：714907749**
欢迎交流自定义地图的制作、安装与游玩问题。
"""
