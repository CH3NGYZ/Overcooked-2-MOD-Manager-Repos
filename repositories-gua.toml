# 🗺️ Custom Map Framework and Dependency Guide

Install the custom map framework to play community-made custom levels!

## 1. Dependency Flow

```mermaid
flowchart TD
    A["🎮 Play custom maps"]
    B["Install `OC2DIYLevel`<br/>custom map framework (required)"]
    C["Place maps in<br/>`OC2DIYLevel/levels`"]
    D{"Does the map require an additional dependency?"}
    E["Play directly"]
    F["Also install `DIYLevelRuntimeWLoader`<br/>by 嘉吖"]
    G["Play maps that require this dependency"]

    A --> B
    B --> C
    C --> D
    D -->|No| E
    D -->|Yes| F
    F --> G

    style B fill:#d9ead3,stroke:#38761d,color:#000
    style C fill:#cfe2f3,stroke:#1155cc,color:#000
    style F fill:#fce5cd,stroke:#b45f06,color:#000
    style E fill:#d9ead3,stroke:#38761d,color:#000
```

## 2. Components

| Component | Required? | Description |
|---|---|---|
| `OC2DIYLevel` | **Required** | The core framework for custom maps. Custom maps cannot be played without it. |
| `OC2DIYLevel/levels` | **Must use** | All custom maps you want to play must be placed in this directory. |
| `DIYLevelRuntimeWLoader` | **Required by some maps** | A shared Web-based prerequisite created by 嘉吖 that provides loading support for custom maps that depend on it. |

## 3. Installation and Usage Recommendations

1. **Install the main framework:** Install the `OC2DIYLevel` custom map framework.
2. **Place the maps:** Put all custom maps you want to play in the `OC2DIYLevel/levels` directory.
3. **Check map dependencies:** Check whether each map requires `DIYLevelRuntimeWLoader`. For maps that require it, also download the `DIYLevelRuntimeWLoader` prerequisite created by 嘉吖.

> **⚠️ Compatibility recommendation**
> If the map you are playing does not require `DIYLevelRuntimeWLoader`, it is recommended to disable this prerequisite in the MOD manager to reduce compatibility conflicts.
> If a map requires it, enable it again; otherwise, the map may fail to load correctly.

## 4. Common Issues and Troubleshooting

If any of the following problems occur, first check the compatibility between `OC2DIYLevel`, `DIYLevelRuntimeWLoader`, and the maps in `OC2DIYLevel/levels`:

- The save-slot list is empty after entering the game.
- The game freezes or all guest players are disconnected after using the Arcade MOD's `一键重开` or `一键退出` feature.

### Recommended Troubleshooting Order

1. Confirm that `OC2DIYLevel` is installed correctly.
2. Confirm that all custom maps are placed in the `OC2DIYLevel/levels` directory.
3. Check whether the map depends on `DIYLevelRuntimeWLoader`.
4. If the map does not require this prerequisite, try disabling it and test again.
5. If the problem persists, remove maps one at a time to identify compatibility issues between a map and the framework.

## 5. Community
**Overcooked! 2 Workshop (QQ Group 4): 714907749**
Feel free to discuss creating, installing, and playing custom maps.
