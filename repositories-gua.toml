```

## 2. 구성 요소 설명

| 구성 요소 | 필요 여부 | 설명 |
|---|---|---|
| `OC2DIYLevel` | **필수 설치** | 사용자 지정 맵의 기반 프레임워크입니다. 이 프레임워크가 없으면 사용자 지정 맵을 플레이할 수 없습니다. |
| `OC2DIYLevel/levels` | **반드시 사용** | 플레이할 모든 사용자 지정 맵을 이 디렉터리에 넣어야 합니다. |
| `DIYLevelRuntimeWLoader` | **일부 맵에 필요** | 嘉吖 선생님이 제작한 Web 공용 선행 모드로, 이 구성 요소에 의존하는 사용자 지정 맵의 로딩을 지원합니다. |

## 3. 설치 및 사용 권장 사항

1. **주 프레임워크 설치:** `OC2DIYLevel` 사용자 지정 맵 프레임워크를 설치합니다.
2. **맵 배치:** 플레이할 모든 사용자 지정 맵을 `OC2DIYLevel/levels` 디렉터리에 넣습니다.
3. **맵 선행 모드 확인:** 각 맵에 `DIYLevelRuntimeWLoader`가 필요한지 확인합니다. 필요한 맵이라면 嘉吖 선생님이 제작한 `DIYLevelRuntimeWLoader` 선행 모드도 다운로드합니다.

> **⚠️ 호환성 권장 사항**
> 현재 플레이하는 맵에 `DIYLevelRuntimeWLoader`가 필요하지 않다면, 호환성 충돌을 줄이기 위해 MOD 관리자에서 해당 선행 모드를 비활성화하는 것이 좋습니다.
> 해당 선행 모드가 필요한 맵이 있다면 다시 활성화하세요. 그렇지 않으면 맵이 정상적으로 로드되지 않을 수 있습니다.

## 4. 자주 발생하는 문제 및 해결 방법

다음 문제가 발생하면 먼저 `OC2DIYLevel`, `DIYLevelRuntimeWLoader`, `OC2DIYLevel/levels`에 있는 맵 사이의 호환성을 확인하세요.

- 게임에 들어간 후 세이브 슬롯 목록이 비어 있습니다.
- Arcade MOD의 `一键重开` 또는 `一键退出` 기능을 사용한 후 게임이 멈추거나 모든 게스트 플레이어의 연결이 끊깁니다.

### 권장 점검 순서

1. `OC2DIYLevel`이 올바르게 설치되었는지 확인합니다.
2. 모든 사용자 지정 맵이 `OC2DIYLevel/levels` 디렉터리에 있는지 확인합니다.
3. 맵이 `DIYLevelRuntimeWLoader`에 의존하는지 확인합니다.
4. 맵에 해당 선행 모드가 필요하지 않다면 선행 모드를 비활성화한 후 다시 테스트합니다.
5. 문제가 계속되면 맵을 하나씩 제거하여 맵과 프레임워크 사이의 호환성 문제를 확인합니다.

