note_i18n.zh-CN = """
需要主机和客机都安装并启用才能正常工作。
- 在游戏主菜单“设置 - MOD”中启用，默认不启用。
- Many Recipes 需要主机和客机都启用。
- 扩展所有故事、DLC、对抗和敌群关卡的食谱，但不包括故事关卡 6-6 和 Sun 1-3；兼容 HardHorde MOD。
- Many Recipes - Display More Menus 只需主机启用，不能单独启用。菜单显示数量会从 2~5 增加到 4~6；对抗模式从 2~3 增加到 3~4。
- 在“街机公开”中无效。"""
note_i18n.zh-TW = """
需要主機和客機都安裝並啟用才能正常運作。
- 在遊戲主選單「設定 - MOD」中啟用，預設為關閉。
- Many Recipes 需要主機和客機都啟用。
- 擴充所有故事、DLC、對抗和敵群關卡的食譜，但不包括故事關卡 6-6 和 Sun 1-3；相容 HardHorde MOD。
- Many Recipes - Display More Menus 只需主機啟用，不能單獨啟用。選單顯示數量會從 2~5 增加到 4~6；對抗模式從 2~3 增加到 3~4。
- 在「街機公開」中無效。"""
note_i18n.en = """
Requires installation and activation of both host and guest players to work properly.
- Enable in the game main menu under Settings - MOD (disabled by default). 
- Many Recipes must be enabled by both host and guest.
- Extends recipes for all story, DLC, versus, and horde levels, except story 6-6 and Sun 1-3. Compatible with the HardHorde mod.
- Many Recipes - Display More Menus only needs to be enabled by the host and cannot be enabled alone. It increases displayed menus from 2~5 to 4~6 (in versus mode, from 2~3 to 3~4).
- Not valid in Arcade Public."""
note_i18n.ko = """
정상적으로 작동하려면 호스트와 게스트 모두 설치하고 활성화해야 합니다.
- 게임 메인 메뉴의 설정 - MOD에서 활성화하세요(기본값은 비활성화). 
- Many Recipes는 호스트와 게스트 모두 활성화해야 합니다.
- 스토리 6-6과 Sun 1-3을 제외한 모든 스토리, DLC, 대전 및 적 무리 레벨의 레시피를 확장합니다. HardHorde MOD와 호환됩니다.
- Many Recipes - Display More Menus는 호스트만 활성화하면 되며 단독으로 활성화할 수 없습니다. 표시되는 메뉴 수를 2~5개에서 4~6개로 늘립니다(대전 모드는 2~3개에서 3~4개).
- Arcade Public에서는 사용할 수 없습니다."""

